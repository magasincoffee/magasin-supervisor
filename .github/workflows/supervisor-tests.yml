name: Supervisor Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/runtime/single-conversation-*.mjs'
      - 'src/ui/**'
      - 'windows/**'
      - 'test/single-conversation-*.test.mjs'
      - 'test/control-panel-single-conversation.test.mjs'
      - 'test/sc013-*.test.mjs'
      - 'test/local-watchdog.test.mjs'
      - 'test/wrapper-child-lifecycle.test.mjs'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/supervisor-tests.yml'
      - '.github/workflows/supervisor-integrity.yml'
      - '.github/workflows/supervisor-sc013-live-production.yml'
      - '.github/workflows/supervisor-control-panel-desktop-4k7im13.yml'
  pull_request:
    paths:
      - 'src/runtime/single-conversation-*.mjs'
      - 'src/ui/**'
      - 'windows/**'
      - 'test/single-conversation-*.test.mjs'
      - 'test/control-panel-single-conversation.test.mjs'
      - 'test/sc013-*.test.mjs'
      - 'test/local-watchdog.test.mjs'
      - 'test/wrapper-child-lifecycle.test.mjs'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-conversation-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run focused SINGLE_CONVERSATION_V1 regressions
        shell: powershell
        run: |
          node --test `
            test/single-conversation-state.test.mjs `
            test/single-conversation-bootstrap.test.mjs `
            test/single-conversation-transaction.test.mjs `
            test/single-conversation-loop.test.mjs `
            test/single-conversation-rollover.test.mjs `
            test/single-conversation-task-protocol.test.mjs `
            test/single-conversation-cli.test.mjs `
            test/control-panel-single-conversation.test.mjs `
            test/sc013-live-observer-contract.test.mjs `
            test/sc013-owner-start-authority.test.mjs `
            test/sc013-production-deploy-boundary.test.mjs `
            test/sc013-legacy-orchestration-retired.test.mjs `
            test/sc013-legacy-runtime-disabled.test.mjs `
            test/local-watchdog.test.mjs `
            test/wrapper-child-lifecycle.test.mjs
      - name: Verify PowerShell syntax for active Windows path
        shell: powershell
        run: |
          node --test test/windows-powershell-syntax.test.mjs
          Write-Host 'SC013_FOCUSED_REGRESSION=True'
          Write-Host 'PRODUCTION_MUTATION=False'