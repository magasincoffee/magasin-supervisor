# MIG-002 extraction-only CI: root-native, GitHub-hosted, no production browser/lifecycle mutation.
name: Supervisor Tests

on:
  push:
    branches:
      - main
      - 'fix/mig-002-*'
    paths:
      - 'src/**'
      - 'test/**'
      - 'windows/**'
      - 'docs/**'
      - 'package.json'
      - '.github/scripts/supervisor-*'
      - '.github/workflows/supervisor-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'windows/**'
      - 'docs/**'
      - 'package.json'
      - '.github/scripts/supervisor-*'
      - '.github/workflows/supervisor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
        shell: powershell

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extraction-safe platform core tests
        run: |
          node --test `
            test/lane-events.test.mjs `
            test/browser-scheduler.test.mjs `
            test/browser-scheduler-integration.test.mjs `
            test/work-watchdog.test.mjs `
            test/work-watchdog-integration.test.mjs `
            test/relay-retry-v48.test.mjs `
            test/relay-rearm-recovery.test.mjs `
            test/work-capacity.test.mjs `
            test/work-rollover.test.mjs `
            test/work-rollover-integration.test.mjs `
            test/target-health.test.mjs `
            test/stale-target-quarantine-integration.test.mjs `
            test/control-panel-status-projection.test.mjs `
            test/control-panel-observability-integration.test.mjs `
            test/brain-planning-contract.test.mjs

      - name: Run Brain planning acceptance fixture
        run: node src/runtime/brain-planning-acceptance-cli.mjs

      - name: Run synthetic runtime fixtures without production targets
        run: |
          node src/runtime/three-lane-cli.mjs --work-full-fixture
          node src/runtime/three-lane-cli.mjs --stale-target-fixture
          node src/runtime/brain-planning-acceptance-cli.mjs

      - name: Run StrictMode soak-monitor parser matrix only
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\supervisor-rbt009-soak-strictmode-tests.ps1"

      - name: Record deferred legacy coupling boundary
        run: |
          Write-Host "MIG_002_EXTRACTION_SAFE_TESTS=True"
          Write-Host "FULL_LEGACY_MONOREPO_SUITE_DEFERRED_TO_MIG_003_MIG_004=True"
          Write-Host "ZERO_PRODUCTION_MUTATION=True"
