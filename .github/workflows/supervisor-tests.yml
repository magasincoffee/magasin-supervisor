name: Supervisor Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - 'package.json'
      - '.github/workflows/supervisor-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - 'package.json'
      - '.github/workflows/supervisor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-runtime-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without side effects
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SC-013 Python SOT preflight bridge
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_sot_python_bridge.py' -v
      - name: Validate read-only Coordinator cycle hook
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_coordinator_cycle_preflight.py' -v
      - name: Verify SC-013 read-only Owner lifecycle
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_owner_lifecycle.py' -v
      - name: Test SC-013 disposable Business Executor exact-once fixture
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_disposable_business_executor.py' -v
      - name: Verify SC-013 GitHub Issue Gateway and Owner provenance read-only
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_dispatch_provenance.py' -v
      - name: Verify SC-013 specialist Owner START STOP attestation contract
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_specialist_lifecycle_attestation.py' -v
      - name: Test SC-013 child robot disabled control explanations
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_specialist_readiness.py' -v
      - name: Verify SC-013 privacy-safe pre-cutover SAPO/SAYDI/Supervisor evidence
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_cutover_preflight.py' -v
      - name: Verify Supervisor SOT link binding and Owner STOP pending proposals
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_supervisor_project_links.py' -v
      - name: Verify read-only Supervisor pending-project GitHub SOT checks
        shell: powershell
        run: python -m unittest discover -s test -p 'test_sc013_project_activation_preflight.py' -v
      - name: Run SINGLE_CONVERSATION_V1 regression suite
        shell: powershell
        run: |
          node --test `
            test/single-conversation-state.test.mjs `
            test/single-conversation-bootstrap.test.mjs `
            test/single-conversation-loop.test.mjs `
            test/single-conversation-rollover.test.mjs `
            test/single-conversation-transaction.test.mjs `
            test/single-conversation-cli.test.mjs `
            test/external-run-recovery.test.mjs `
            test/external-run-local-observer.test.mjs `
            test/task-execution-optimization.test.mjs `
            test/control-panel-single-conversation.test.mjs `
            test/windows-browser-background.test.mjs `
            test/windows-cdp-restart.test.mjs `
            test/snapshot-access.test.mjs `
            test/sc013-production-deploy-boundary.test.mjs `
            test/sc013-coordinator-readonly-stage.test.mjs `
            test/sc013-coordinator-inert-apply.test.mjs `
            test/sc013-coordinator-hook-apply.test.mjs `
            test/sc013-owner-lifecycle-control.test.mjs `
            test/sc013-specialist-readiness-ui.test.mjs `
            test/sc013-control-center-consolidation-policy.test.mjs `
            test/sc013-unified-inventory-readonly.test.mjs `
            test/sc013-cutover-risk-ui.test.mjs `
            test/sc013-supervisor-project-links-ui.test.mjs `
            test/sc013-project-activation-safe-preflight.test.mjs `
            test/sc013-owner-control-apply.test.mjs `
            test/sc013-sot-adapter.test.mjs `
            test/sc013-live-observer-contract.test.mjs `
            test/sc013-owner-start-authority.test.mjs `
            test/supervisor-guardian.test.mjs
      - name: Check staging PowerShell parses without running on production
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/sc013-coordinator-readonly-stage.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw 'COORDINATOR_STAGE_PS_SYNTAX_INVALID'}
          Write-Host 'COORDINATOR_STAGE_PS_SYNTAX_PASS=True'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/sc013-coordinator-inert-apply.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw ('COORDINATOR_APPLY_PS_SYNTAX_INVALID: '+($errors -join '; '))}
          Write-Host 'COORDINATOR_APPLY_PS_SYNTAX_PASS=True'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/sc013-coordinator-hook-apply.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw ('COORDINATOR_HOOK_PS_SYNTAX_INVALID: '+($errors -join '; '))}
          Write-Host 'COORDINATOR_HOOK_PS_SYNTAX_PASS=True'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/sc013-owner-control-apply.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw ('OWNER_CONTROL_PS_SYNTAX_INVALID: '+($errors -join '; '))}
          Write-Host 'OWNER_CONTROL_PS_SYNTAX_PASS=True'
      - name: Parse Control Center JS without launching local services
        shell: powershell
        run: node --check src/control-center/web/app.js
      - name: Validate and fixture-test MIG-CC-01 inventory without host mutation
        shell: powershell
        run: |
          $p=Join-Path $PWD 'windows/sc013-unified-control-inventory.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw ('MIG_CC_01_PS_SYNTAX_INVALID: '+($errors -join '; '))}
          $fixture=Join-Path $PWD 'test/fixtures/sc013-unified-inventory-fixture.json'
          $output=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -FixtureOnly -FixtureJson $fixture
          if($LASTEXITCODE -ne 0){throw 'MIG_CC_01_FIXTURE_EXEC_FAILED'}
          $json=($output|Out-String)|ConvertFrom-Json
          if($json.host -ne 'SIMULATED_ONLY' -or
             $json.cutover_qualified -ne $false -or
             $json.business_dispatch_enabled -ne $false -or
             $json.milestone_status -ne 'IN_PROGRESS' -or
             $json.task_evidence.Count -ne 4 -or
             !($json.blockers -contains 'FIXTURE_NOT_PRODUCTION_EVIDENCE')){
            throw 'MIG_CC_01_FIXTURE_FAILED_CLOSED'
          }
          Write-Host 'MIG_CC_01_INVENTORY_FIXTURE_GREEN=True'
      - name: Confirm no production mutation
        shell: powershell
        run: Write-Host "ZERO_PRODUCTION_MUTATION=True"