name: Supervisor Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - windows/**
      - test/**
      - SOURCE_OF_TRUTH.md
      - package.json
      - .github/workflows/**
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - src/**
      - windows/**
      - test/**
      - SOURCE_OF_TRUTH.md
      - package.json
      - .github/workflows/**
      - .github/scripts/**

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run canonical SINGLE_CONVERSATION_V1 regressions
        shell: powershell
        run: node --test test/actions.test.mjs test/atomic-json-write.test.mjs test/autostart-recovery.test.mjs test/control-panel-single-conversation.test.mjs test/lifecycle-truth-v50.test.mjs test/local-watchdog.test.mjs test/owner-start-latch-recovery.test.mjs test/playwright-target-recovery.test.mjs test/project-adapter.test.mjs test/sc013-active-surface.test.mjs test/sc013-legacy-orchestration-retired.test.mjs test/sc013-legacy-runtime-disabled.test.mjs test/sc013-live-observer-contract.test.mjs test/sc013-owner-start-authority.test.mjs test/sc013-production-deploy-boundary.test.mjs test/single-conversation-bootstrap.test.mjs test/single-conversation-cli.test.mjs test/single-conversation-loop.test.mjs test/single-conversation-rollover.test.mjs test/single-conversation-state.test.mjs test/single-conversation-task-protocol.test.mjs test/single-conversation-transaction.test.mjs test/snapshot-access.test.mjs test/source-of-truth-authority.test.mjs test/state-root.test.mjs test/submit-flight-recorder.test.mjs test/ui-classifier.test.mjs test/windows-browser-background.test.mjs test/windows-cdp-restart.test.mjs test/windows-installer-upgrade.test.mjs test/windows-kill-switch.test.mjs test/windows-powershell-syntax.test.mjs test/windows-state-root-binding.test.mjs test/wrapper-child-lifecycle.test.mjs
