# MIG-004 hosted CI: full root-native independent-repository regression.
name: Supervisor Tests

on:
  push:
    branches:
      - main
      - 'mig-004/**'
    paths:
      - 'src/**'
      - 'test/**'
      - 'windows/**'
      - 'docs/**'
      - 'package.json'
      - '.github/scripts/supervisor-*'
      - '.github/workflows/supervisor-*.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'windows/**'
      - 'docs/**'
      - 'package.json'
      - '.github/scripts/supervisor-*'
      - '.github/workflows/supervisor-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: powershell

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full independent-repository regression suite
        run: npm test

      - name: Run RBT-009 StrictMode parser matrix
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\supervisor-rbt009-soak-strictmode-tests.ps1"

      - name: Run synthetic acceptance CLIs
        run: |
          node src/runtime/three-lane-cli.mjs --work-full-fixture
          node src/runtime/three-lane-cli.mjs --stale-target-fixture
          node src/runtime/brain-planning-acceptance-cli.mjs

      - name: Record MIG-004 hosted regression markers
        run: |
          Write-Host "MIG_004_FULL_ROOT_NATIVE_REGRESSION=True"
          Write-Host "MIG_004_PROJECT_ADAPTER_V1_PRESERVED=True"
          Write-Host "MIG_004_STATE_ROOT_V1_PRESERVED=True"
          Write-Host "MIG_004_EXACT_ONCE_REGRESSION=True"
          Write-Host "MIG_004_SCHEDULER_WATCHDOG_ROLLOVER_REGRESSION=True"
          Write-Host "MIG_004_PRIVACY_REGRESSION=True"
          Write-Host "SELF_HOSTED_PRODUCTION_AUTHORITY_UNCHANGED=True"
          Write-Host "ZERO_PRODUCTION_MUTATION=True"
