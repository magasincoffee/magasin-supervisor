name: SC-013 Guarded Task ID Backfill

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/sc013-backfill-current-task-id.mjs
      - .github/workflows/sc013-guarded-task-id-backfill.yml

permissions:
  contents: read

jobs:
  backfill:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Guarded metadata-only backfill
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "SC013_BACKFILL_SLOT=${{ matrix.slot }}"
          Write-Host "SC013_BACKFILL_MACHINE=$env:COMPUTERNAME"
          if($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13'){
            Write-Host 'SC013_BACKFILL_TARGET_MATCH=False'
            Start-Sleep -Seconds 90
            exit 0
          }
          Write-Host 'SC013_BACKFILL_TARGET_MATCH=True'
          . ".\windows\state-root.ps1"
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $runtime=Join-Path $root 'runtime'
          $state=Join-Path $root 'single-conversation-state.json'
          if(-not (Test-Path $state)){ throw 'single-conversation-state.json missing' }
          node ".github\scripts\sc013-backfill-current-task-id.mjs" $runtime $state
          if($LASTEXITCODE -ne 0){ throw "SC013 guarded backfill failed with exit $LASTEXITCODE" }
