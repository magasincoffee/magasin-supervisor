name: Supervisor Lifecycle Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - '.github/workflows/supervisor-lifecycle-acceptance.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - '.github/workflows/supervisor-lifecycle-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-lifecycle-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-conversation-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without side effects
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate current lifecycle contracts
        shell: powershell
        run: |
          node --test `
            test/control-panel-single-conversation.test.mjs `
            test/windows-browser-background.test.mjs `
            test/windows-cdp-restart.test.mjs
          Write-Host "SINGLE_CONVERSATION_LIFECYCLE_PASS=True"
          Write-Host "ZERO_PRODUCTION_MUTATION=True"
