name: Supervisor Lifecycle Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - windows/**
      - test/**
      - package.json
      - .github/workflows/supervisor-lifecycle-acceptance.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - windows/**
      - test/**
      - package.json
      - .github/workflows/supervisor-lifecycle-acceptance.yml

permissions:
  contents: read

concurrency:
  group: supervisor-lifecycle-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-parity-hosted:
    name: lifecycle-isolated
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run isolated lifecycle contracts
        shell: powershell
        run: node --test test/lifecycle-truth-v50.test.mjs test/lifecycle-acceptance-optional-latch.test.mjs test/owner-start-latch-recovery.test.mjs test/wrapper-child-lifecycle.test.mjs test/windows-kill-switch.test.mjs test/windows-cdp-restart.test.mjs
      - name: Record zero production mutation
        shell: powershell
        run: Write-Host 'ZERO_PRODUCTION_MUTATION=True'
