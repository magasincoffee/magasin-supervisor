name: SC-010 Live Stall Diagnostic

on:
  push:
    branches:
      - sc010-live-stall-diagnostic
    paths:
      - '.github/workflows/sc010-live-stall-diagnostic.yml'
      - '.github/scripts/sc010-live-stall-diagnostic.ps1'
      - '.github/scripts/sc010-live-cdp-probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc010-live-stall-diagnostic
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 8
    outputs:
      target_match: ${{ steps.diag.outputs.target_match }}
      diagnosed: ${{ steps.diag.outputs.diagnosed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only runtime diagnostic attempt 1
        id: diag
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc010-live-stall-diagnostic.ps1" -Attempt 1 -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 75
          if errorlevel 1 exit /b %ERRORLEVEL%
          node ".github\scripts\sc010-live-cdp-probe.mjs"
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 8
    outputs:
      target_match: ${{ steps.diag.outputs.target_match }}
      diagnosed: ${{ steps.diag.outputs.diagnosed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only runtime diagnostic attempt 2
        id: diag
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc010-live-stall-diagnostic.ps1" -Attempt 2 -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 75
          if errorlevel 1 exit /b %ERRORLEVEL%
          node ".github\scripts\sc010-live-cdp-probe.mjs"
          exit /b %ERRORLEVEL%

  diagnostic-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Require target diagnostic
        shell: powershell
        run: |
          $a1m='${{ needs.attempt-1.outputs.target_match }}'
          $a1d='${{ needs.attempt-1.outputs.diagnosed }}'
          $a2m='${{ needs.attempt-2.outputs.target_match }}'
          $a2d='${{ needs.attempt-2.outputs.diagnosed }}'
          Write-Host "SC010_AUTH_A1_MATCH=$a1m"
          Write-Host "SC010_AUTH_A1_DIAG=$a1d"
          Write-Host "SC010_AUTH_A2_MATCH=$a2m"
          Write-Host "SC010_AUTH_A2_DIAG=$a2d"
          if (-not (($a1m -eq 'true' -and $a1d -eq 'true') -or ($a2m -eq 'true' -and $a2d -eq 'true'))) {
            throw 'No read-only diagnostic ran on DESKTOP-4K7IM13.'
          }
          Write-Host 'SC010_DIAGNOSTIC_AUTHORITY=PASS'
