name: SC-013 Overnight Stability Observation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sc013-overnight-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc013-live-production-first-failure
  cancel-in-progress: false

jobs:
  overnight-observer:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 500
    steps:
      - uses: actions/checkout@v4
      - name: Observe production sequentially until 06:00 UTC+7
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-overnight-observer.ps1" -TargetComputer "DESKTOP-4K7IM13" -EndUtc "2026-09-30T23:00:00Z" -AttemptSeconds 1200 -PollSeconds 5 -NonTargetHoldSeconds 60
          exit /b %ERRORLEVEL%

