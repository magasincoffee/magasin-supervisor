name: SC-013 Overnight Stability Observation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sc013-overnight-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc013-live-production-first-failure
  cancel-in-progress: true

jobs:
  overnight-observer:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 500
    steps:
      - uses: actions/checkout@v4
      - name: Release production target runner after WAIT_RESPONSE recovery fix
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-overnight-observer.ps1" -TargetComputer "DESKTOP-4K7IM13" -EndUtc "2026-09-30T16:00:00Z" -AttemptSeconds 60 -PollSeconds 5 -NonTargetHoldSeconds 15
          exit /b %ERRORLEVEL%

