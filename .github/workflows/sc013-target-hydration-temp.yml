name: SC-013 Target Hydration TEMP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sc013-target-hydration-temp.yml'
      - '.github/scripts/sc013-target-hydration-temp.mjs'

permissions:
  contents: read

concurrency:
  group: sc013-target-hydration-temp
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Measure exact Recent candidate hydration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "DIAG_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') { throw 'Wrong target' }
          . '.\windows\state-root.ps1'
          . '.\windows\lifecycle-truth.ps1'
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $chrome=Get-LifecycleRobotChrome -Root $root
          if(-not $chrome -or [string]$chrome.CommandLine -notmatch '--remote-debugging-port=(\d+)'){ throw 'CDP unavailable' }
          $cdp="http://127.0.0.1:$($matches[1])"
          $runtime=Join-Path $root 'runtime'
          node ".github\scripts\sc013-target-hydration-temp.mjs" --state (Join-Path $root 'single-conversation-state.json') --cdp-url $cdp --runtime $runtime --runtime-id "chat:0a2e510ffd86a7df06fa7ff81a7cd572"
