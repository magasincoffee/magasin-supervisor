name: SC-011 Emergency Production Stop
on:
  push:
    branches: [sc011-production-runtime-diagnostic-20260929]
    paths:
      - '.github/scripts/supervisor-sc011-emergency-stop.ps1'
      - '.github/workflows/supervisor-sc011-emergency-stop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc011-emergency-production-stop
  cancel-in-progress: true
jobs:
  stop:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stop production robot only on target
        shell: cmd
        run: |
          @echo off
          echo SC011_STOP_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-emergency-stop.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
