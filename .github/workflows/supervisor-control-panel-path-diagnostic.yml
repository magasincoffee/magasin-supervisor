name: Supervisor Control Panel Path Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-control-panel-path-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Control Panel sources and launch paths
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ".\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot -Compatibility "legacy-preserve"
          $installedPanel = Join-Path $root "runtime\windows\control-panel.ps1"
          $sourcePanel = (Resolve-Path ".\windows\control-panel.ps1").Path

          Write-Host "DIAG_COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "DIAG_ROOT=$root"
          Write-Host "DIAG_SOURCE_PANEL=$sourcePanel"
          Write-Host "DIAG_INSTALLED_PANEL=$installedPanel"

          foreach ($label in @("SOURCE","INSTALLED")) {
            $path = if ($label -eq "SOURCE") { $sourcePanel } else { $installedPanel }
            if (Test-Path $path) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash
              $text = Get-Content $path -Raw -Encoding UTF8
              Write-Host "DIAG_$($label)_EXISTS=True"
              Write-Host "DIAG_$($label)_SHA256=$hash"
              Write-Host "DIAG_$($label)_RESET_READY=$($text -match [regex]::Escape('RESET READY'))"
              Write-Host "DIAG_$($label)_RESET_BUTTON=$($text -match 'resetAllButton')"
              Write-Host "DIAG_$($label)_RESET_POS=$($text -match [regex]::Escape('Drawing.Point(820, 20)'))"
            } else {
              Write-Host "DIAG_$($label)_EXISTS=False"
            }
          }

          Write-Host "DIAG_CONTROL_PANEL_PROCESSES_BEGIN"
          $procs = Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -like "*control-panel.ps1*" } |
            Sort-Object ProcessId
          if (-not $procs) {
            Write-Host "DIAG_CONTROL_PANEL_PROCESS=NONE"
          } else {
            foreach ($p in $procs) {
              Write-Host "DIAG_CONTROL_PANEL_PID=$($p.ProcessId)"
              Write-Host "DIAG_CONTROL_PANEL_EXE=$($p.ExecutablePath)"
              Write-Host "DIAG_CONTROL_PANEL_CMD=$($p.CommandLine)"
            }
          }
          Write-Host "DIAG_CONTROL_PANEL_PROCESSES_END"

          Write-Host "DIAG_DESKTOP_SHORTCUTS_BEGIN"
          $shell = New-Object -ComObject WScript.Shell
          $desktops = @(
            [Environment]::GetFolderPath("Desktop"),
            [Environment]::GetFolderPath("CommonDesktopDirectory")
          ) | Select-Object -Unique
          foreach ($desktop in $desktops) {
            if (-not $desktop -or -not (Test-Path $desktop)) { continue }
            Get-ChildItem -Path $desktop -Filter "*.lnk" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*MAGASIN*" -or $_.Name -like "*BUSINESS OS*" } |
              ForEach-Object {
                $shortcut = $shell.CreateShortcut($_.FullName)
                Write-Host "DIAG_SHORTCUT_FILE=$($_.FullName)"
                Write-Host "DIAG_SHORTCUT_TARGET=$($shortcut.TargetPath)"
                Write-Host "DIAG_SHORTCUT_ARGS=$($shortcut.Arguments)"
                Write-Host "DIAG_SHORTCUT_WORKDIR=$($shortcut.WorkingDirectory)"
              }
          }
          Write-Host "DIAG_DESKTOP_SHORTCUTS_END"

          Write-Host "DIAG_HKCU_RUN_BEGIN"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (Test-Path $runKey) {
            $props = Get-ItemProperty $runKey
            foreach ($name in @("MAGASINBusinessOSAutostart","MAGASINBusinessOS","MAGASINSupervisor")) {
              if ($props.PSObject.Properties[$name]) {
                Write-Host "DIAG_HKCU_RUN_$name=$($props.$name)"
              }
            }
          }
          Write-Host "DIAG_HKCU_RUN_END"

          Write-Host "DIAG_DONE=PASS"


      - name: Inspect live Control Panel UI tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $cim = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -like "*control-panel.ps1*" } |
            Sort-Object ProcessId |
            Select-Object -First 1

          if (-not $cim) {
            Write-Host "UI_DIAG_PROCESS=NONE"
            exit 2
          }

          $proc = Get-Process -Id ([int]$cim.ProcessId) -ErrorAction Stop
          Write-Host "UI_DIAG_PID=$($proc.Id)"
          Write-Host "UI_DIAG_MAIN_WINDOW_TITLE=$($proc.MainWindowTitle)"
          Write-Host "UI_DIAG_MAIN_WINDOW_HANDLE=$($proc.MainWindowHandle)"

          if ($proc.MainWindowHandle -eq 0) {
            Write-Host "UI_DIAG_WINDOW_HANDLE_ZERO=True"
            exit 3
          }

          $root = [System.Windows.Automation.AutomationElement]::FromHandle($proc.MainWindowHandle)
          if (-not $root) {
            Write-Host "UI_DIAG_AUTOMATION_ROOT=False"
            exit 4
          }
          Write-Host "UI_DIAG_AUTOMATION_ROOT=True"

          $condition = [System.Windows.Automation.Condition]::TrueCondition
          $nodes = $root.FindAll(
            [System.Windows.Automation.TreeScope]::Descendants,
            $condition
          )

          $resetFound = $false
          $resetReadyFound = $false
          for ($i = 0; $i -lt $nodes.Count; $i++) {
            $el = $nodes.Item($i)
            $name = [string]$el.Current.Name
            $type = [string]$el.Current.ControlType.ProgrammaticName
            if ($name -match "RESET READY") {
              $resetReadyFound = $true
              Write-Host "UI_DIAG_RESET_READY_ELEMENT=True"
            }
            if ($name -match "LÀM SẠCH TẤT CẢ DỰ ÁN") {
              $resetFound = $true
              $rect = $el.Current.BoundingRectangle
              Write-Host "UI_DIAG_RESET_BUTTON=True"
              Write-Host "UI_DIAG_RESET_BUTTON_NAME=$name"
              Write-Host "UI_DIAG_RESET_BUTTON_TYPE=$type"
              Write-Host "UI_DIAG_RESET_BUTTON_RECT=$($rect.X),$($rect.Y),$($rect.Width),$($rect.Height)"
              Write-Host "UI_DIAG_RESET_BUTTON_OFFSCREEN=$($el.Current.IsOffscreen)"
              Write-Host "UI_DIAG_RESET_BUTTON_ENABLED=$($el.Current.IsEnabled)"
            }
          }

          Write-Host "UI_DIAG_RESET_READY_FOUND=$resetReadyFound"
          Write-Host "UI_DIAG_RESET_FOUND=$resetFound"
          if (-not $resetFound) { exit 5 }
          Write-Host "UI_DIAG=PASS"


  lifecycle-evidence:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read START and Owner STOP evidence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "EVIDENCE_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne "DESKTOP-4K7IM13") {
            Write-Host "EVIDENCE_TARGET_MATCH=False"
            exit 0
          }
          Write-Host "EVIDENCE_TARGET_MATCH=True"
          . ".\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot -Compatibility "legacy-preserve"
          Write-Host "EVIDENCE_NOW_UTC=$([DateTimeOffset]::UtcNow.ToString('o'))"
          foreach ($name in @("STOP","AUTOSTART_DISABLED","supervisor.pid","start-attempt-status.json","wrapper-startup.stdout.log","wrapper-startup.stderr.log","single-conversation-state.json","local-watchdog-status.json")) {
            $path = Join-Path $root $name
            Write-Host "EVIDENCE_FILE=$name"
            Write-Host "EVIDENCE_EXISTS=$(Test-Path $path)"
            if (-not (Test-Path $path)) { continue }
            $item = Get-Item $path
            Write-Host "EVIDENCE_CREATED_UTC=$($item.CreationTimeUtc.ToString('o'))"
            Write-Host "EVIDENCE_WRITE_UTC=$($item.LastWriteTimeUtc.ToString('o'))"
            Write-Host "EVIDENCE_LENGTH=$($item.Length)"
            if ($name -in @("STOP","AUTOSTART_DISABLED","supervisor.pid","start-attempt-status.json")) {
              Write-Host "EVIDENCE_CONTENT_BEGIN"
              Get-Content $path -Raw -ErrorAction SilentlyContinue
              Write-Host "EVIDENCE_CONTENT_END"
            } elseif ($name -like "wrapper-startup.*.log") {
              Write-Host "EVIDENCE_TAIL_BEGIN"
              Get-Content $path -ErrorAction SilentlyContinue | Select-Object -Last 100
              Write-Host "EVIDENCE_TAIL_END"
            } elseif ($name -eq "single-conversation-state.json") {
              try {
                $st = Get-Content $path -Raw -Encoding UTF8 | ConvertFrom-Json
                Write-Host "STATE_UPDATED_AT=$($st.updated_at)"
                Write-Host "STATE_AUTOMATION=$($st.automation.status)"
                Write-Host "STATE_PHASE=$($st.automation.phase)"
                Write-Host "STATE_REASON=$($st.automation.reason)"
                Write-Host "STATE_OUTBOUND=$($st.outbound.state)"
                Write-Host "STATE_RETRY_COUNT=$($st.outbound.retry_count)"
                Write-Host "STATE_LAST_ERROR=$($st.outbound.last_error_code)"
              } catch { Write-Host "STATE_PARSE_ERROR=$($_.Exception.Message)" }
            }
          }
          Write-Host "EVIDENCE_PROCESSES_BEGIN"
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and (
                $_.CommandLine -like "*run-supervisor.ps1*" -or
                $_.CommandLine -like "*single-conversation-cli.mjs*" -or
                $_.CommandLine -like "*stop-supervisor.ps1*" -or
                $_.CommandLine -like "*local-watchdog.ps1*" -or
                $_.CommandLine -like "*MAGASIN\Supervisor\browser_profile*"
              )
            } |
            Sort-Object ProcessId |
            ForEach-Object {
              Write-Host "PROC_PID=$($_.ProcessId)"
              Write-Host "PROC_PPID=$($_.ParentProcessId)"
              Write-Host "PROC_NAME=$($_.Name)"
              Write-Host "PROC_CMD=$($_.CommandLine)"
            }
          Write-Host "EVIDENCE_PROCESSES_END"
          $events = Join-Path $root "local-watchdog-events.ndjson"
          if (Test-Path $events) {
            Write-Host "EVENTS_TAIL_BEGIN"
            Get-Content $events -ErrorAction SilentlyContinue | Select-Object -Last 100
            Write-Host "EVENTS_TAIL_END"
          }
