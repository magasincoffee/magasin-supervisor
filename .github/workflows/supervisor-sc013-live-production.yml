name: SC-013 Live Production First-Failure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-sc013-live-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc013-live-production-first-failure
  cancel-in-progress: false

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 28
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - name: Run real production path attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-live-production.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 150 -MaxObserveSeconds 1200 -StallSeconds 240
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 28
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - name: Run real production path attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-live-production.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 150 -MaxObserveSeconds 1200 -StallSeconds 240
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require real target PASS
        shell: powershell
        run: |
          $a1Match='${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass='${{ needs.attempt-1.outputs.qualified }}'
          $a2Match='${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass='${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC013_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC013_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC013_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC013_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified=(($a1Match -eq 'true' -and $a1Pass -eq 'true') -or ($a2Match -eq 'true' -and $a2Pass -eq 'true'))
          if(-not $qualified){throw 'SC-013 has no successful real-target production qualification.'}
          Write-Host 'SC013_QUALIFICATION_AUTHORITY=PASS'

