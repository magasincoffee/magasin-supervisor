name: SC-013 Live Production First-Failure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/sc013-live-observation-request.json'

permissions:
  contents: read

concurrency:
  group: sc013-live-production-first-failure
  cancel-in-progress: true

jobs:
  attempt:
    runs-on: self-hosted
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Run real production first-failure attempt
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-live-production.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 150 -OwnerStartWaitSeconds 900 -MaxObserveSeconds 3600 -StallSeconds 240
          exit /b %ERRORLEVEL%
