name: SC-011 Repair False Enqueued State

on:
  push:
    branches:
      - sc011-production-runtime-diagnostic-20260929
    paths:
      - '.github/scripts/supervisor-sc011-repair-false-enqueued.ps1'
      - '.github/workflows/supervisor-sc011-repair-false-enqueued.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc011-repair-false-enqueued
  cancel-in-progress: true

jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Repair proven false-ENQUEUED production state and verify delivery
        shell: cmd
        run: |
          @echo off
          echo SC011_REPAIR_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-repair-false-enqueued.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%
