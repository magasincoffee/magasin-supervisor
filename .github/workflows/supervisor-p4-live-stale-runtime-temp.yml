name: Supervisor P4 Live Stale Runtime Temp

on:
  push:
    branches:
      - hotfix/supervisor-autonomy-selfheal-v1
    paths:
      - .github/p4-live-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-p4-live-stale-runtime-v1
  cancel-in-progress: true

jobs:
  p4-live:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify migrated MAGASIN live runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-4K7IM13") {
            throw "LIVE_P4_WRONG_RUNNER"
          }
          Write-Host "LIVE_P4_RUNNER_MATCH=True"
          Write-Host ("LIVE_P4_RUNNER_NAME=" + $env:COMPUTERNAME)

      - name: Run isolated P4 stale runtime live acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".github\scripts\supervisor-p4-live-isolated.ps1"
