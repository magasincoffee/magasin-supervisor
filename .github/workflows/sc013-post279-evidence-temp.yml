name: SC-013 Post-279 Evidence TEMP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sc013-post279-evidence-temp.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read post-279 production state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "EVIDENCE_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') {
            Write-Host 'EVIDENCE_TARGET_MATCH=False'
            exit 0
          }
          Write-Host 'EVIDENCE_TARGET_MATCH=True'
          . '.\windows\state-root.ps1'
          . '.\windows\lifecycle-truth.ps1'
          $root = Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $truth = Get-LifecycleProcessTruth -Root $root
          Write-Host "EVIDENCE_WRAPPER_ALIVE=$([bool]$truth.wrapper_alive)"
          Write-Host "EVIDENCE_RUNTIME_ALIVE=$([bool]$truth.runtime_alive)"
          Write-Host "EVIDENCE_CDP_HEALTHY=$([bool]$truth.cdp_healthy)"

          $statePath = Join-Path $root 'single-conversation-state.json'
          if (Test-Path $statePath) {
            $s = Get-Content $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host "STATE_UPDATED_AT=$($s.updated_at)"
            Write-Host "STATE_GENERATION=$($s.conversation.generation)"
            Write-Host "STATE_CONVERSATION_STATUS=$($s.conversation.status)"
            Write-Host "STATE_RUNTIME_ID=$($s.conversation.runtime_id)"
            Write-Host "STATE_AUTOMATION=$($s.automation.status)"
            Write-Host "STATE_PHASE=$($s.automation.phase)"
            Write-Host "STATE_REASON=$($s.automation.reason)"
            Write-Host "STATE_OUTBOUND=$($s.outbound.state)"
            Write-Host "STATE_KIND=$($s.outbound.kind)"
            Write-Host "STATE_RETRY_COUNT=$($s.outbound.retry_count)"
            Write-Host "STATE_LAST_ERROR_CODE=$($s.outbound.last_error_code)"
            Write-Host "STATE_LAST_ERROR_STAGE=$($s.outbound.last_error_stage)"
          }

          foreach ($name in @('wrapper-startup.stdout.log','wrapper-startup.stderr.log','start-attempt-status.json','local-watchdog-status.json')) {
            $p = Join-Path $root $name
            Write-Host "FILE_BEGIN=$name"
            if (Test-Path $p) {
              if ($name -like 'wrapper-startup.*.log') {
                Get-Content $p -ErrorAction SilentlyContinue | Select-Object -Last 220
              } else {
                Get-Content $p -Raw -ErrorAction SilentlyContinue
              }
            }
            Write-Host "FILE_END=$name"
          }

          if ($truth.cdp_healthy) {
            $chrome = Get-LifecycleRobotChrome -Root $root
            if ($chrome -and [string]$chrome.CommandLine -match '--remote-debugging-port=(\d+)') {
              $cdp = "http://127.0.0.1:$([int]$Matches[1])"
              $runtimeProbe = Join-Path $root 'runtime\src\runtime\local-watchdog-probe-cli.mjs'
              Write-Host 'DIRECT_UI_PROBE_BEGIN'
              & node.exe $runtimeProbe --state $statePath --cdp-url $cdp
              Write-Host 'DIRECT_UI_PROBE_END'
              $exactProbe = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\sc013-post279-exact-turn-temp.mjs'
              Write-Host 'EXACT_TURN_PROBE_BEGIN'
              & node.exe $exactProbe --runtime (Join-Path $root 'runtime') --state $statePath --cdp-url $cdp
              Write-Host 'EXACT_TURN_PROBE_END'
            }
          }