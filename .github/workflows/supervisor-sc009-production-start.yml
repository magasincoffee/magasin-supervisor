            }
          
            if ($nodeObserved -and $stateObserved -and $cdpPort) { break }
            Start-Sleep -Milliseconds 500
          }
          
          Write-Host "SC009_LIVE_SINGLE_NODE_OBSERVED=$nodeObserved"
          Write-Host "SC009_LIVE_STATE_CREATED=$stateObserved"
          Write-Host "SC009_LIVE_GENERATION=$generationObserved"
          if (-not $nodeObserved) { throw 'single-conversation-cli.mjs was never observed after production START.' }
          if (-not $stateObserved) { throw 'single-conversation-state.json was not created after production START.' }
          if (-not $cdpPort) { throw 'Dedicated Supervisor Chrome CDP port was not found after production START.' }
          
          $cdpUrl = "http://127.0.0.1:$cdpPort"
          & node "$env:GITHUB_WORKSPACE\.github\scripts\supervisor-sc009-production-start-verify.mjs" $cdpUrl $sourceOfTruthUrl 120000
          if ($LASTEXITCODE -ne 0) {
            throw "Production browser verification failed with exit code $LASTEXITCODE."
          }
          
          $finalState = Get-Content $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "SC009_LIVE_FINAL_CONVERSATION_STATUS=$($finalState.conversation.status)"
          Write-Host "SC009_LIVE_FINAL_AUTOMATION_STATUS=$($finalState.automation.status)"
          Write-Host "SC009_LIVE_FINAL_AUTOMATION_PHASE=$($finalState.automation.phase)"
          Write-Host "SC009_LIVE_FINAL_OUTBOUND_STATE=$($finalState.outbound.state)"
          Write-Host 'SC009_LIVE_PRODUCTION_START=PASS'
          "qualified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require target production START PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC009_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC009_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC009_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC009_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'SC-009 has no successful production START qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC009_QUALIFICATION_AUTHORITY=PASS'
