          }
          Write-Host 'SC009_LIVE_CONTROL_PRESERVED=True'
          
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $installedStart -Hidden
          if ($LASTEXITCODE -ne 0) {
            throw "Production START failed with exit code $LASTEXITCODE."
          }
          Write-Host 'SC009_LIVE_OWNER_START_INVOKED=True'
          
          $nodeObserved = $false
          $stateObserved = $false
          $generationObserved = 0
          $cdpPort = $null
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(120)
          
          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -match 'single-conversation-cli\.mjs' })
            if ($nodes.Count -gt 0) {
              $nodeObserved = $true
            }
          
            if (Test-Path $statePath) {
              try {
                $state = Get-Content $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
                $generationObserved = [int]$state.conversation.generation
                if (
                  [string]$state.mode -eq 'SINGLE_CONVERSATION_V1' -and
