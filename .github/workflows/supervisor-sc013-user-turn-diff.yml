name: SC-013 User Turn Diff
on:
  push:
    branches: [sc011-production-runtime-diagnostic-20260929]
    paths:
      - '.github/scripts/supervisor-sc013-user-turn-diff.ps1'
      - '.github/scripts/supervisor-sc013-user-turn-diff.mjs'
      - '.github/workflows/supervisor-sc013-user-turn-diff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare expected outbound with actual user turn
        shell: cmd
        run: |
          @echo off
          echo TURN_DIFF_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-user-turn-diff.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
