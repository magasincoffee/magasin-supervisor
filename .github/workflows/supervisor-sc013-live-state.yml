name: SC-013 Live State Snapshot
on:
  push:
    branches: [sc011-production-runtime-diagnostic-20260929]
    paths:
      - '.github/scripts/supervisor-sc013-live-state.ps1'
      - '.github/workflows/supervisor-sc013-live-state.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc013-live-state-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read target state only
        shell: cmd
        run: |
          @echo off
          echo SC013_STATE_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-live-state.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
