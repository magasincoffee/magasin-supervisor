name: SC-011 Production Runtime Diagnostic

on:
  push:
    branches:
      - sc011-production-runtime-diagnostic-20260929
    paths:
      - '.github/scripts/supervisor-sc011-production-runtime-diagnostic.ps1'
      - '.github/workflows/supervisor-sc011-production-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc011-production-runtime-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded production diagnostic
        shell: cmd
        run: |
          @echo off
          echo SC011_DIAG_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-production-runtime-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 150 -ObserveSeconds 120
          exit /b %ERRORLEVEL%
