name: SC-013 Start Stop Read Only Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sc013-start-stop-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live start-stop state without mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "SC013_START_DIAG_SLOT=${{ matrix.slot }}"
          Write-Host "SC013_START_DIAG_MACHINE=$env:COMPUTERNAME"
          if($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13'){
            Write-Host 'SC013_START_DIAG_TARGET_MATCH=False'
            Start-Sleep -Seconds 90
            exit 0
          }
          Write-Host 'SC013_START_DIAG_TARGET_MATCH=True'
          . ".\windows\state-root.ps1"
          . ".\windows\lifecycle-truth.ps1"
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $statePath=Join-Path $root 'single-conversation-state.json'
          $controlPath=Join-Path $root 'single-conversation-control.json'
          $stopPath=Join-Path $root 'STOP'
          $autoPath=Join-Path $root 'AUTOSTART_DISABLED'
          $truth=Get-LifecycleProcessTruth -Root $root
          $ownerStop=Get-LifecycleOwnerStopState -Root $root
          Write-Host "SC013_START_DIAG_ROOT=$root"
          Write-Host "SC013_START_DIAG_STOP_FILE=$([bool](Test-Path $stopPath))"
          Write-Host "SC013_START_DIAG_AUTOSTART_DISABLED=$([bool](Test-Path $autoPath))"
          Write-Host "SC013_START_DIAG_OWNER_STOP_BLOCKED=$([bool]$ownerStop.blocked)"
          Write-Host "SC013_START_DIAG_WRAPPER_ALIVE=$([bool]$truth.wrapper_alive)"
          Write-Host "SC013_START_DIAG_CHROME_ALIVE=$([bool]$truth.chrome_alive)"
          Write-Host "SC013_START_DIAG_CDP_HEALTHY=$([bool]$truth.cdp_healthy)"
          Write-Host "SC013_START_DIAG_RUNTIME_MODE=$([string]$truth.runtime_mode)"
          if(Test-Path $controlPath){
            $c=Get-Content $controlPath -Raw -Encoding UTF8|ConvertFrom-Json
            Write-Host "SC013_START_DIAG_CONTROL_SCHEMA=$([string]$c.schema_version)"
            Write-Host "SC013_START_DIAG_CONTROL_MODE=$([string]$c.mode)"
            Write-Host "SC013_START_DIAG_CONTROL_SOT=$([string]$c.source_of_truth_url)"
          } else {
            Write-Host 'SC013_START_DIAG_CONTROL_MISSING=True'
          }
          if(Test-Path $statePath){
            $s=Get-Content $statePath -Raw -Encoding UTF8|ConvertFrom-Json
            Write-Host "SC013_START_DIAG_STATE_UPDATED=$([string]$s.updated_at)"
            Write-Host "SC013_START_DIAG_CONVERSATION_STATUS=$([string]$s.conversation.status)"
            Write-Host "SC013_START_DIAG_GENERATION=$([string]$s.conversation.generation)"
            Write-Host "SC013_START_DIAG_AUTOMATION_STATUS=$([string]$s.automation.status)"
            Write-Host "SC013_START_DIAG_AUTOMATION_PHASE=$([string]$s.automation.phase)"
            Write-Host "SC013_START_DIAG_AUTOMATION_REASON=$([string]$s.automation.reason)"
            Write-Host "SC013_START_DIAG_OUTBOUND_STATE=$([string]$s.outbound.state)"
            Write-Host "SC013_START_DIAG_OUTBOUND_KIND=$([string]$s.outbound.kind)"
            Write-Host "SC013_START_DIAG_OUTBOUND_MESSAGE_ID=$([string]$s.outbound.message_id)"
            Write-Host "SC013_START_DIAG_OUTBOUND_LAST_ERROR=$([string]$s.outbound.last_error_code)"
            Write-Host "SC013_START_DIAG_OUTBOUND_LAST_STAGE=$([string]$s.outbound.last_error_stage)"
          } else {
            Write-Host 'SC013_START_DIAG_STATE_MISSING=True'
          }
          Write-Host 'SC013_START_DIAG_PROCESSES_BEGIN'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and ($_.CommandLine -match 'run-supervisor\.ps1|single-conversation-cli\.mjs|chrome\.exe.*remote-debugging-port') } |
            Sort-Object ProcessId |
            ForEach-Object {
              Write-Host "SC013_START_DIAG_PROCESS=$($_.ProcessId)|$($_.Name)|$($_.ParentProcessId)|$($_.CommandLine)"
            }
          Write-Host 'SC013_START_DIAG_PROCESSES_END'
          Write-Host 'SC013_START_DIAG_DONE=PASS'
