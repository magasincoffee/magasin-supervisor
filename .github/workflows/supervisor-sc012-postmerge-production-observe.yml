name: SC-012 Post-Merge Production Observe

on:
  push:
    branches:
      - sc012-restart-replacement-regression
    paths:
      - '.github/scripts/supervisor-sc012-postmerge-production-observe.ps1'
      - '.github/workflows/supervisor-sc012-postmerge-production-observe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc012-postmerge-production-observe
  cancel-in-progress: true

jobs:
  observe-1:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Observe real production on target
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc012-postmerge-production-observe.ps1" -TargetComputer "DESKTOP-4K7IM13" -ObserveSeconds 180 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  observe-2:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Observe real production on target
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc012-postmerge-production-observe.ps1" -TargetComputer "DESKTOP-4K7IM13" -ObserveSeconds 180 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%
