name: SC-011 Live Stuck Send Snapshot

on:
  push:
    branches:
      - sc011-production-runtime-diagnostic-20260929
    paths:
      - '.github/scripts/supervisor-sc011-live-stuck-snapshot.ps1'
      - '.github/scripts/supervisor-sc011-live-stuck-dom.mjs'
      - '.github/workflows/supervisor-sc011-live-stuck-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc011-live-stuck-send-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read live stuck-send state
        shell: cmd
        run: |
          @echo off
          echo LIVE_STUCK_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-live-stuck-snapshot.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%
