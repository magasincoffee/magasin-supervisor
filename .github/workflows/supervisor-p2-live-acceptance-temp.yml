name: Supervisor P2 Live Acceptance Temp

on:
  push:
    branches:
      - hotfix/supervisor-autonomy-selfheal-v1
    paths:
      - .github/workflows/supervisor-p2-live-acceptance-temp.yml
      - .github/scripts/supervisor-p2-live-brain-fixture.mjs
      - .github/scripts/supervisor-p2-live-isolated-evidence.mjs
      - .github/scripts/supervisor-p2-live-isolated.ps1
      - .github/scripts/supervisor-p2-runtime-diagnostic.ps1
      - src/runtime/three-lane-cli.mjs
      - src/runtime/work-target-state.mjs
      - src/runtime/work-rollover.mjs
      - src/runtime/lane-events.mjs
  pull_request:
    paths:
      - .github/workflows/supervisor-p2-live-acceptance-temp.yml
      - .github/scripts/supervisor-p2-live-brain-fixture.mjs
      - .github/scripts/supervisor-p2-live-isolated-evidence.mjs
      - .github/scripts/supervisor-p2-live-isolated.ps1
      - src/runtime/three-lane-cli.mjs
      - src/runtime/work-target-state.mjs
      - src/runtime/work-rollover.mjs
      - src/runtime/lane-events.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-p2-live-acceptance-temp
  cancel-in-progress: true

jobs:
  p2-live:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      P2_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4


      - name: Enforce canonical H4A16IL runner identity
        shell: cmd
        run: |
          if /I not "%COMPUTERNAME%"=="DESKTOP-H4A16IL" (
            echo LIVE_P2_RUNNER_MATCH=False
            exit /b 1
          )
          echo LIVE_P2_RUNNER_NAME=DESKTOP-H4A16IL
          echo LIVE_P2_RUNNER_MATCH=True

      - name: Install runtime dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run sanitized H4A16IL runtime diagnostics
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-p2-runtime-diagnostic.ps1"

      - name: Run isolated P2 AUTO Work live acceptance
        if: ${{ env.P2_LIVE_ENABLED == 'true' }}
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-p2-live-isolated.ps1"

