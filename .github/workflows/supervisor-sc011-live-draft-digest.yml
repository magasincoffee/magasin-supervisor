name: SC-011 Live Draft Digest
on:
  push:
    branches: [sc011-production-runtime-diagnostic-20260929]
    paths:
      - '.github/scripts/supervisor-sc011-live-draft-digest.ps1'
      - '.github/scripts/supervisor-sc011-live-draft-digest.mjs'
      - '.github/workflows/supervisor-sc011-live-draft-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare live composer draft digest
        shell: cmd
        run: |
          @echo off
          echo DIGEST_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-live-draft-digest.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
