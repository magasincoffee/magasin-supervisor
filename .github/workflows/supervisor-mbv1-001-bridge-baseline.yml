name: MBV1-001 Bridge Baseline

on:
  push:
    branches:
      - mbv1-001-bridge-baseline
    paths:
      - '.github/workflows/supervisor-mbv1-001-bridge-baseline.yml'
      - '.github/scripts/supervisor-mbv1-001-bridge-baseline.ps1'
      - '.github/scripts/supervisor-mbv1-001-bridge-baseline.mjs'
      - '.github/qualification/mbv1-001-extension/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-baseline:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supervisor Node dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run isolated MBV1-001 live bridge baseline
        shell: cmd
        run: |
          @echo off
          echo MBV1_001_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-001-bridge-baseline.ps1" -TargetComputer "DESKTOP-4K7IM13" -BridgeCommit "848efb9e85f52f251c82ab099747833c0693c072"
          exit /b %ERRORLEVEL%

      - name: Upload MBV1-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbv1-001-evidence-slot-${{ matrix.slot }}
          path: .github/qualification/mbv1-001-artifact
          if-no-files-found: ignore
          retention-days: 7
