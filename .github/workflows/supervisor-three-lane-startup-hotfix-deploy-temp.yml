name: Supervisor Three-Lane Startup Hotfix Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-three-lane-startup-hotfix-deploy-temp.yml
      - .github/scripts/deploy-three-lane-startup-hotfix.ps1

permissions:
  contents: read

jobs:
  targeted-deploy:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard in CMD and deploy only DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo DEPLOY_SLOT=${{ matrix.slot }}
          echo DEPLOY_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\deploy-three-lane-startup-hotfix.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
