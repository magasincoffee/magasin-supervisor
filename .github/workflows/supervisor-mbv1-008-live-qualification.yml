name: MBV1-008 Final Bridge Qualification

on:
  push:
    branches:
      - mbv1-008-bridge-qualification-cutover
    paths:
      - '.github/workflows/supervisor-mbv1-008-live-qualification.yml'
      - '.github/scripts/supervisor-mbv1-008-live-qualification.ps1'
      - '.github/scripts/supervisor-mbv1-008-live-qualification.mjs'
      - '.github/scripts/supervisor-mbv1-008-authority-attempt.ps1'
      - 'src/runtime/chatgpt-bridge-*.mjs'
      - 'src/runtime/planner-executor-bridge-*.mjs'
      - 'windows/chatgpt-bridge-runtime.ps1'
      - 'windows/run-supervisor.ps1'
      - 'windows/lifecycle-truth.ps1'
      - 'test/mbv1-008-qualification-matrix.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbv1-008-final-bridge-qualification
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run canonical 12-scenario matrix
        shell: cmd
        run: node --test test/mbv1-008-qualification-matrix.test.mjs
      - name: Run target-guarded live qualification attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-008-authority-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run canonical 12-scenario matrix
        shell: cmd
        run: node --test test/mbv1-008-qualification-matrix.test.mjs
      - name: Run target-guarded live qualification attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-008-authority-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require real target PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "MBV1_008_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "MBV1_008_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "MBV1_008_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "MBV1_008_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'MBV1-008 has no successful live qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'MBV1_008_AUTHORITY_GATE=PASS'
