name: MAGASIN Local Dispatch Receipts

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional existing dispatch Issue number; empty checks recent open dispatch issues"
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: magasin-local-dispatch-receipts
  cancel-in-progress: false

jobs:
  local-receipt:
    if: ${{ github.repository == 'magasincoffee/magasin-supervisor' && (github.event_name != 'issues' || startsWith(github.event.issue.title, '[MAGASIN-DISPATCH]')) }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run 30-minute SC-013 local control tick
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Environment]::MachineName -ne 'DESKTOP-H4A16IL') {
            throw 'WRONG_TARGET_MACHINE'
          }
          $python = 'C:\\MAGASIN_MCP\\.venv\\Scripts\\python.exe'
          if (-not (Test-Path $python)) { throw 'MCP_PYTHON_MISSING' }
          & $python '.github\\scripts\\sc013-local-30m-tick.py'
          if ($LASTEXITCODE -ne 0) {
            throw 'SC013_LOCAL_TICK_FAILED'
          }
      - name: Report validated local jobs on the authorized machine
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_ISSUE: ${{ github.event.issue.number || inputs.issue_number || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Environment]::MachineName -ne 'DESKTOP-H4A16IL') {
            throw 'WRONG_RUNNER: local dispatch receipts require DESKTOP-H4A16IL'
          }
          $python = 'C:\MAGASIN_MCP\.venv\Scripts\python.exe'
          $reporter = '.github\scripts\magasin-dispatch-reporter.py'
          if (-not (Test-Path $python) -or -not (Test-Path $reporter)) {
            throw 'Local MCP or reporter not installed'
          }
          if ($env:DISPATCH_ISSUE -match '^[0-9]+$') {
            & $python $reporter --issue ([int]$env:DISPATCH_ISSUE)
          } else {
            & $python $reporter
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Local dispatch reporter failed; do not claim completion'
          }
