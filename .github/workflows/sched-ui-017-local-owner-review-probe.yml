name: SCHED-UI-017 Local Review Persistence Probe

on:
  push:
    branches:
      - 'owner-review/sched-ui-017-local'
    paths:
      - '.github/workflows/sched-ui-017-local-owner-review-probe.yml'

permissions:
  contents: read

jobs:
  verify-local-review:
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Pin probe to DESKTOP-4K7IM13 and verify port 8772
        shell: cmd
        run: |
          @echo off
          echo PROBE_SLOT=${{ matrix.slot }}
          echo PROBE_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo NON_TARGET_HOLD=True
            timeout /t 45 /nobreak >NUL
            exit /b 0
          )
          echo TARGET_MATCH=True
          curl.exe -fsS "http://127.0.0.1:8772/09_QA/people-shift/ui2-012-manager-scheduling-fixture.html" | findstr /C:"ui2ManagerScheduling" >NUL
          if errorlevel 1 (
            echo LOCAL_REVIEW_PERSISTENCE=FAIL
            exit /b 1
          )
          echo LOCAL_REVIEW_PERSISTENCE=PASS
          echo LOCAL_REVIEW_URL=http://127.0.0.1:8772/09_QA/people-shift/ui2-012-manager-scheduling-fixture.html
