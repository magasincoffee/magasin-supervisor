name: SCHED-UI-017 Local Review Persistence Probe

on:
  push:
    branches:
      - 'owner-review/sched-ui-017-local'
    paths:
      - '.github/workflows/sched-ui-017-local-owner-review-probe.yml'

permissions:
  contents: read

jobs:
  verify-local-review:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Verify local review server survived prior runner cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') {
            throw "Wrong self-hosted runner: $env:COMPUTERNAME"
          }
          $url = 'http://127.0.0.1:8772/09_QA/people-shift/ui2-012-manager-scheduling-fixture.html'
          $resp = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 10
          if ($resp.StatusCode -ne 200) {
            throw "Local review persistence probe failed: $($resp.StatusCode)"
          }
          if ($resp.Content -notmatch 'ui2ManagerScheduling') {
            throw 'Local review fixture marker missing.'
          }
          Write-Host "LOCAL_REVIEW_PERSISTENCE=PASS"
          Write-Host "LOCAL_REVIEW_URL=$url"
