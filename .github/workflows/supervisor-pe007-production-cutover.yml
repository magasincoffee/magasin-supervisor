name: PE-007 Planner Executor Production Cutover

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-pe007-production-cutover.yml'
      - '.github/scripts/supervisor-pe007-production-cutover.ps1'
      - '.github/scripts/supervisor-pe007-cutover-attempt.ps1'
      - 'src/runtime/planner-executor-cutover.mjs'
      - 'src/runtime/planner-executor-cutover-cli.mjs'
      - 'src/runtime/planner-executor-cli.mjs'
      - 'src/runtime/planner-executor.mjs'
      - 'src/runtime/planner-executor-session.mjs'
      - 'src/runtime/planner-executor-automation.mjs'
      - 'windows/run-supervisor.ps1'
      - 'windows/lifecycle-truth.ps1'
      - 'windows/install-supervisor.ps1'
      - 'windows/repair-supervisor.ps1'
      - 'docs/SUPERVISOR_PLANNER_EXECUTOR_V1_SOURCE_OF_TRUTH.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      target_match: ${{ steps.cutover.outputs.target_match }}
      cutover: ${{ steps.cutover.outputs.cutover }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded production cutover attempt 1
        id: cutover
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-cutover-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      target_match: ${{ steps.cutover.outputs.target_match }}
      cutover: ${{ steps.cutover.outputs.cutover }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded production cutover attempt 2
        id: cutover
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-cutover-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  cutover-authority:
    if: always()
    needs:
      - attempt-1
      - attempt-2
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main for cutover evidence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require real target production cutover PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Cutover = '${{ needs.attempt-1.outputs.cutover }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Cutover = '${{ needs.attempt-2.outputs.cutover }}'

          Write-Host "PE007_CUTOVER_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "PE007_CUTOVER_ATTEMPT1_PASS=$a1Cutover"
          Write-Host "PE007_CUTOVER_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "PE007_CUTOVER_ATTEMPT2_PASS=$a2Cutover"

          $passed = (
            ($a1Match -eq 'true' -and $a1Cutover -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Cutover -eq 'true')
          )
          if (-not $passed) {
            throw 'PE-007 production cutover has no successful target-machine PASS.'
          }
          Write-Host 'PE007_PRODUCTION_CUTOVER_AUTHORITY=PASS'

      - name: Persist authoritative production cutover result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Cutover = '${{ needs.attempt-1.outputs.cutover }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Cutover = '${{ needs.attempt-2.outputs.cutover }}'

          $dir = Join-Path $env:GITHUB_WORKSPACE '.github\qualification'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir 'pe007-cutover-latest.json'
          $payload = [ordered]@{
            schema = 'pe007-production-cutover-result.v1'
            status = 'PASS'
            production_cutover = $true
            mode = 'PLANNER_EXECUTOR_V1'
            candidate_sha = '${{ github.sha }}'
            workflow_run_id = [int64]'${{ github.run_id }}'
            workflow_run_number = [int]'${{ github.run_number }}'
            target_computer = 'DESKTOP-4K7IM13'
            attempt_1 = [ordered]@{
              target_match = ($a1Match -eq 'true')
              cutover = ($a1Cutover -eq 'true')
            }
            attempt_2 = [ordered]@{
              target_match = ($a2Match -eq 'true')
              cutover = ($a2Cutover -eq 'true')
            }
            chatgpt_work_mode_invocations = 0
            rollback_required = $true
            recorded_at_utc = [DateTime]::UtcNow.ToString('o')
          }

          [System.IO.File]::WriteAllText(
            $path,
            ($payload | ConvertTo-Json -Depth 8) + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/qualification/pe007-cutover-latest.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'PE007_CUTOVER_EVIDENCE_UNCHANGED=True'
            exit 0
          }
          git commit -m "evidence(pe-007): record production cutover PASS"
          git push origin HEAD:main
          Write-Host 'PE007_CUTOVER_EVIDENCE_PERSISTED=True'
