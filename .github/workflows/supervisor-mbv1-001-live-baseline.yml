name: MBV1-001 Live Bridge Baseline

on:
  push:
    branches:
      - mbv1-001-live-bridge-baseline
    paths:
      - '.github/workflows/supervisor-mbv1-001-live-baseline.yml'
      - '.github/scripts/supervisor-mbv1-001-live-baseline.ps1'
      - '.github/scripts/supervisor-mbv1-001-live-baseline.mjs'
      - 'src/ui/playwright-adapter.mjs'
      - 'windows/state-root.ps1'
      - 'windows/lifecycle-truth.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbv1-001-live-bridge-baseline
  cancel-in-progress: false

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qual.outputs.target_match }}
      qualified: ${{ steps.qual.outputs.qualified }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Supervisor dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check qualification harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-mbv1-001-live-baseline.mjs"
      - name: Run target-guarded Bridge baseline attempt 1
        id: qual
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-001-live-baseline.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qual.outputs.target_match }}
      qualified: ${{ steps.qual.outputs.qualified }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Supervisor dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check qualification harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-mbv1-001-live-baseline.mjs"
      - name: Run target-guarded Bridge baseline attempt 2
        id: qual
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-001-live-baseline.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require target-machine PASS
        shell: powershell
        run: |
          $a1Match='${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass='${{ needs.attempt-1.outputs.qualified }}'
          $a2Match='${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass='${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "MBV1_001_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "MBV1_001_ATTEMPT1_PASS=$a1Pass"
          Write-Host "MBV1_001_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "MBV1_001_ATTEMPT2_PASS=$a2Pass"
          $passed=(($a1Match -eq 'true' -and $a1Pass -eq 'true') -or ($a2Match -eq 'true' -and $a2Pass -eq 'true'))
          if (-not $passed) { throw 'MBV1-001 has no target-machine PASS.' }
          Write-Host 'MBV1_001_AUTHORITY=PASS'
