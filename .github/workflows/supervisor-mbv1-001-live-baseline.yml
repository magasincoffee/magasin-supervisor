name: MBV1-001 Live Bridge Baseline

on:
  push:
    branches:
      - mbv1-001-live-bridge-baseline
    paths:
      - '.github/workflows/supervisor-mbv1-001-live-baseline.yml'
      - '.github/scripts/supervisor-mbv1-001-live-baseline.ps1'
      - '.github/scripts/supervisor-mbv1-001-live-baseline.mjs'
      - 'src/ui/playwright-adapter.mjs'
      - 'windows/state-root.ps1'
      - 'windows/lifecycle-truth.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbv1-001-live-bridge-baseline
  cancel-in-progress: false

jobs:
  live-baseline:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supervisor dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax-check qualification harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-mbv1-001-live-baseline.mjs"

      - name: Run pinned two-tab Bridge baseline
        shell: cmd
        run: |
          @echo off
          echo MBV1_001_QUAL_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-001-live-baseline.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
