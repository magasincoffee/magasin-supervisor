name: MBV1-008 Production Bridge Cutover

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-mbv1-008-production-cutover.yml'
      - '.github/scripts/supervisor-mbv1-008-production-cutover.ps1'
      - '.github/scripts/supervisor-mbv1-008-cutover-attempt.ps1'
      - '.github/scripts/supervisor-mbv1-008-live-qualification.ps1'
      - '.github/scripts/supervisor-mbv1-008-live-qualification.mjs'
      - 'src/runtime/planner-executor-bridge-cli.mjs'
      - 'src/runtime/chatgpt-bridge-page-runtime.mjs'
      - 'windows/chatgpt-bridge-runtime.ps1'
      - 'windows/set-planner-executor-transport.ps1'
      - 'windows/run-supervisor.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbv1-008-production-bridge-cutover
  cancel-in-progress: false

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      target_match: ${{ steps.cutover.outputs.target_match }}
      qualified: ${{ steps.cutover.outputs.qualified }}
      cutover: ${{ steps.cutover.outputs.cutover }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Requalify and cut over attempt 1
        id: cutover
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-008-cutover-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      target_match: ${{ steps.cutover.outputs.target_match }}
      qualified: ${{ steps.cutover.outputs.qualified }}
      cutover: ${{ steps.cutover.outputs.cutover }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Requalify and cut over attempt 2
        id: cutover
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-mbv1-008-cutover-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  cutover-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require target qualification and cutover PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Qual = '${{ needs.attempt-1.outputs.qualified }}'
          $a1Cut = '${{ needs.attempt-1.outputs.cutover }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Qual = '${{ needs.attempt-2.outputs.qualified }}'
          $a2Cut = '${{ needs.attempt-2.outputs.cutover }}'
          $pass = (
            ($a1Match -eq 'true' -and $a1Qual -eq 'true' -and $a1Cut -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Qual -eq 'true' -and $a2Cut -eq 'true')
          )
          Write-Host "MBV1_008_CUTOVER_ATTEMPT1=$a1Match/$a1Qual/$a1Cut"
          Write-Host "MBV1_008_CUTOVER_ATTEMPT2=$a2Match/$a2Qual/$a2Cut"
          if (-not $pass) {
            throw 'MBV1-008 has no authoritative target-machine production cutover PASS.'
          }
          Write-Host 'MBV1_008_CUTOVER_AUTHORITY=PASS'

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist authoritative cutover evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Qual = '${{ needs.attempt-1.outputs.qualified }}'
          $a1Cut = '${{ needs.attempt-1.outputs.cutover }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Qual = '${{ needs.attempt-2.outputs.qualified }}'
          $a2Cut = '${{ needs.attempt-2.outputs.cutover }}'
          $pass = (
            ($a1Match -eq 'true' -and $a1Qual -eq 'true' -and $a1Cut -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Qual -eq 'true' -and $a2Cut -eq 'true')
          )
          if (-not $pass) { throw 'Refusing evidence write without authoritative PASS.' }

          $dir = Join-Path $env:GITHUB_WORKSPACE '.github\qualification'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = Join-Path $dir 'mbv1-008-cutover-latest.json'
          $payload = [ordered]@{
            schema = 'mbv1-008-production-cutover.v1'
            status = 'PASS'
            candidate_sha = '${{ github.sha }}'
            workflow_run_id = [int64]'${{ github.run_id }}'
            workflow_run_number = [int]'${{ github.run_number }}'
            target_computer = 'DESKTOP-4K7IM13'
            primary_transport = 'CHATGPT_BRIDGE_V1'
            rollback_transport = 'DIRECT_DOM_V1'
            bridge_upstream_commit = '848efb9e85f52f251c82ab099747833c0693c072'
            openai_api_required = $false
            attempt_1 = [ordered]@{
              target_match = ($a1Match -eq 'true')
              qualified = ($a1Qual -eq 'true')
              cutover = ($a1Cut -eq 'true')
            }
            attempt_2 = [ordered]@{
              target_match = ($a2Match -eq 'true')
              qualified = ($a2Qual -eq 'true')
              cutover = ($a2Cut -eq 'true')
            }
            recorded_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          [System.IO.File]::WriteAllText(
            $path,
            ($payload | ConvertTo-Json -Depth 8) + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/qualification/mbv1-008-cutover-latest.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "evidence(mbv1-008): record Bridge production cutover PASS"
            git push origin HEAD:main
          }
          Write-Host 'MBV1_008_CUTOVER_EVIDENCE_PERSISTED=True'
