name: Supervisor Control Panel Live Target V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-control-panel-live-target-v2.yml
      - .github/scripts/diag-control-panel-target.ps1

permissions:
  contents: read

jobs:
  inspect-target:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1,2,3,4,5,6]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard and inspect target
        shell: cmd
        run: |
          @echo off
          echo DIAG_SLOT=\${{ matrix.slot }}
          echo DIAG_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\diag-control-panel-target.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
