name: Supervisor Canonical State Root Binding Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-canonical-state-root-binding-temp.yml
      - .github/scripts/deploy-canonical-state-root-binding.ps1

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1,2,3,4,5,6]
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy only DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo SLOT=${{ matrix.slot }}
          echo MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\deploy-canonical-state-root-binding.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
