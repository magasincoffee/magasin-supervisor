name: SC-013 Recovery Preflight
on:
  push:
    branches:
      - sc011-production-runtime-diagnostic-20260929
    paths:
      - '.github/scripts/supervisor-sc013-recovery-preflight.ps1'
      - '.github/scripts/supervisor-sc013-recovery-preflight.mjs'
      - '.github/workflows/supervisor-sc013-recovery-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read target recovery preflight
        shell: cmd
        run: |
          @echo off
          echo SC013_PREFLIGHT_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-recovery-preflight.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
