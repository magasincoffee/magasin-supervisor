name: SC-011 Production Project Start

on:
  push:
    branches:
      - sc011-live-task-continuity
    paths:
      - '.github/workflows/supervisor-sc011-production-start.yml'
      - '.github/scripts/supervisor-sc011-production-start.ps1'

permissions:
  contents: read

concurrency:
  group: sc011-production-start
  cancel-in-progress: false

jobs:
  start-1:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Start configured production project attempt 1
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-production-start.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 180
          exit /b %ERRORLEVEL%

  start-2:
    runs-on: self-hosted
    timeout-minutes: 7
