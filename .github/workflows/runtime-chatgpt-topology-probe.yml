name: Runtime ChatGPT Topology Probe

on:
  push:
    branches:
      - rbt-runtime-chatgpt-open-fix-20260928
    paths:
      - .github/workflows/runtime-chatgpt-topology-probe.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Inspect live browser and bridge topology
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "TOPOLOGY_SLOT=${{ matrix.slot }}"
          if($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13'){
            Write-Host "TOPOLOGY_TARGET_MATCH=False"
            exit 0
          }
          Write-Host "TOPOLOGY_TARGET_MATCH=True"
          . ".\windows\state-root.ps1"
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $life=Join-Path $root 'runtime\windows\lifecycle-truth.ps1'
          . $life
          $truth=Get-LifecycleProcessTruth -Root $root
          Write-Host "TOPOLOGY_MODE=$([string]$truth.runtime_mode)"
          Write-Host "TOPOLOGY_WRAPPER=$([bool]$truth.wrapper_alive)"
          Write-Host "TOPOLOGY_RUNTIME=$([bool]$truth.runtime_alive)"
          Write-Host "TOPOLOGY_CHROME=$([bool]$truth.chrome_alive)"
          Write-Host "TOPOLOGY_CDP=$([bool]$truth.cdp_healthy)"
          Write-Host "TOPOLOGY_HEALTHY=$([bool]$truth.healthy)"

          $statusPath=Join-Path $root 'planner-executor-status.json'
          if(Test-Path $statusPath){
            $status=Get-Content $statusPath -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host "TOPOLOGY_STATUS_PHASE=$([string]$status.phase)"
            Write-Host "TOPOLOGY_STATUS_TABS=$([string]$status.chatgpt_tabs)"
            Write-Host "TOPOLOGY_STATUS_AUTOMATION=$([string]$status.automation_status)"
            Write-Host "TOPOLOGY_STATUS_UPDATED=$([string]$status.updated_at)"
          }

          if($truth.chrome_alive -and $truth.cdp_healthy){
            $chrome=Get-LifecycleRobotChrome -Root $root
            if($chrome.CommandLine -match '--remote-debugging-port=(\d+)'){
              $port=[int]$Matches[1]
              Write-Host "TOPOLOGY_CDP_PORT=$port"
              $targets=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 3)
              Write-Host "TOPOLOGY_CDP_TARGETS=$($targets.Count)"
              $chat=0;$conv=0;$rootCount=0
              foreach($t in $targets){
                $kind='OTHER'
                try{
                  $u=[Uri]([string]$t.url)
                  if($u.Host -eq 'chatgpt.com'){
                    $chat++
                    if($u.AbsolutePath.StartsWith('/c/')){$kind='CHATGPT_CONVERSATION';$conv++}
                    elseif($u.AbsolutePath.StartsWith('/auth/') -or $u.AbsolutePath -eq '/auth' -or $u.AbsolutePath.StartsWith('/login')){$kind='CHATGPT_AUTH'}
                    elseif($u.AbsolutePath -eq '/' -or [string]::IsNullOrWhiteSpace($u.AbsolutePath)){$kind='CHATGPT_ROOT';$rootCount++}
                    else{$kind='CHATGPT_OTHER'}
                  }
                }catch{}
                Write-Host "TOPOLOGY_CDP_TARGET=TYPE=$([string]$t.type)|CLASS=$kind"
              }
              Write-Host "TOPOLOGY_CDP_CHATGPT=$chat"
              Write-Host "TOPOLOGY_CDP_CONVERSATIONS=$conv"
              Write-Host "TOPOLOGY_CDP_ROOT=$rootCount"
            }
          }

          $failurePath=Join-Path $root 'planner-executor-startup-failure.json'
          if(Test-Path $failurePath){
            try{
              $failure=Get-Content $failurePath -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host "TOPOLOGY_FAILURE_STAGE=$([string]$failure.stage)"
              Write-Host "TOPOLOGY_FAILURE_NAME=$([string]$failure.error_name)"
              Write-Host "TOPOLOGY_FAILURE_DIGEST=$([string]$failure.error_digest)"
              Write-Host "TOPOLOGY_FAILURE_RECORDED=$([string]$failure.recorded_at)"
            }catch{Write-Host "TOPOLOGY_FAILURE_READ_ERROR=True"}
          }else{
            Write-Host "TOPOLOGY_FAILURE_MISSING=True"
          }

          $transportPath=Join-Path $root 'planner-executor-transport.json'
          if(Test-Path $transportPath){
            try{
              $transport=Get-Content $transportPath -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host "TOPOLOGY_TRANSPORT_PRIMARY=$([string]$transport.primary)"
            }catch{}
          }

          try{
            $bs=Invoke-RestMethod -Uri 'http://127.0.0.1:5000/status' -TimeoutSec 3
            Write-Host "TOPOLOGY_BRIDGE_STATUS=True"
            Write-Host "TOPOLOGY_BRIDGE_CONNECTED=$([string]$bs.pages_connected)"
            Write-Host "TOPOLOGY_BRIDGE_ALIVE=$([string]$bs.pages_alive)"
            $bp=Invoke-RestMethod -Uri 'http://127.0.0.1:5000/pages' -TimeoutSec 3
            $pages=@($bp.pages)
            Write-Host "TOPOLOGY_BRIDGE_PAGES=$($pages.Count)"
            foreach($p in $pages){
              $kind='OTHER'
              try{
                $u=[Uri]([string]$p.url)
                if($u.Host -eq 'chatgpt.com'){
                  if($u.AbsolutePath.StartsWith('/c/')){$kind='CHATGPT_CONVERSATION'}
                  elseif($u.AbsolutePath.StartsWith('/auth/') -or $u.AbsolutePath -eq '/auth' -or $u.AbsolutePath.StartsWith('/login')){$kind='CHATGPT_AUTH'}
                  elseif($u.AbsolutePath -eq '/' -or [string]::IsNullOrWhiteSpace($u.AbsolutePath)){$kind='CHATGPT_ROOT'}
                  else{$kind='CHATGPT_OTHER'}
                }
              }catch{}
              Write-Host "TOPOLOGY_BRIDGE_PAGE=ALIVE=$([bool]$p.alive)|CLASS=$kind"
            }
          }catch{
            Write-Host "TOPOLOGY_BRIDGE_STATUS=False"
          }
          Write-Host "TOPOLOGY_PROBE=PASS"
