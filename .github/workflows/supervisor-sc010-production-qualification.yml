name: SC-010 Production Continuity Qualification

on:
  push:
    branches:
      - sc010-live-stall-diagnostic
    paths:
      - '.github/workflows/supervisor-sc010-production-qualification.yml'
      - '.github/scripts/supervisor-sc010-production-qualification.ps1'
      - '.github/scripts/supervisor-sc010-production-verify.mjs'
      - 'src/runtime/single-conversation-*.mjs'
      - 'src/ui/**'
      - 'windows/run-supervisor.ps1'
      - 'windows/start-supervisor.ps1'
      - 'windows/install-supervisor.ps1'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc010-production-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 28
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install verifier dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run production continuity qualification attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc010-production-qualification.ps1" -Attempt 1 -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 28
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install verifier dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run production continuity qualification attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc010-production-qualification.ps1" -Attempt 2 -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require target production continuity PASS
        shell: powershell
        run: |
          $a1m = '${{ needs.attempt-1.outputs.target_match }}'
          $a1p = '${{ needs.attempt-1.outputs.qualified }}'
          $a2m = '${{ needs.attempt-2.outputs.target_match }}'
          $a2p = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC010_AUTH_A1_TARGET_MATCH=$a1m"
          Write-Host "SC010_AUTH_A1_QUALIFIED=$a1p"
          Write-Host "SC010_AUTH_A2_TARGET_MATCH=$a2m"
          Write-Host "SC010_AUTH_A2_QUALIFIED=$a2p"
          if (-not (($a1m -eq 'true' -and $a1p -eq 'true') -or ($a2m -eq 'true' -and $a2p -eq 'true'))) {
            throw 'SC-010 has no successful production continuity qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC010_QUALIFICATION_AUTHORITY=PASS'
