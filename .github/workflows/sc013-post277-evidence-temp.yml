name: SC-013 Post-277 Evidence TEMP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sc013-post277-evidence-temp.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact post-277 failure evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "EVIDENCE_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') {
            Write-Host 'EVIDENCE_TARGET_MATCH=False'
            exit 0
          }
          Write-Host 'EVIDENCE_TARGET_MATCH=True'
          . '.\windows\state-root.ps1'
          $root = Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          Write-Host "EVIDENCE_NOW_UTC=$([DateTimeOffset]::UtcNow.ToString('o'))"

          foreach ($name in @('start-attempt-status.json','wrapper-startup.stdout.log','wrapper-startup.stderr.log','single-conversation-state.json','local-watchdog-status.json')) {
            $p = Join-Path $root $name
            Write-Host "FILE_BEGIN=$name"
            Write-Host "FILE_EXISTS=$(Test-Path $p)"
            if (Test-Path $p) {
              $item = Get-Item $p
              Write-Host "FILE_CREATED_UTC=$($item.CreationTimeUtc.ToString('o'))"
              Write-Host "FILE_WRITE_UTC=$($item.LastWriteTimeUtc.ToString('o'))"
              if ($name -like 'wrapper-startup.*.log') {
                Write-Host 'FILE_TAIL_BEGIN'
                Get-Content $p -ErrorAction SilentlyContinue | Select-Object -Last 220
                Write-Host 'FILE_TAIL_END'
              } elseif ($name -eq 'single-conversation-state.json') {
                $s = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
                Write-Host "STATE_UPDATED_AT=$($s.updated_at)"
                Write-Host "STATE_AUTOMATION=$($s.automation.status)"
                Write-Host "STATE_PHASE=$($s.automation.phase)"
                Write-Host "STATE_REASON=$($s.automation.reason)"
                Write-Host "STATE_OUTBOUND=$($s.outbound.state)"
                Write-Host "STATE_KIND=$($s.outbound.kind)"
                Write-Host "STATE_PREPARED_AT=$($s.outbound.prepared_at)"
                Write-Host "STATE_RETRY_COUNT=$($s.outbound.retry_count)"
                Write-Host "STATE_LAST_ERROR_CODE=$($s.outbound.last_error_code)"
                Write-Host "STATE_LAST_ERROR_STAGE=$($s.outbound.last_error_stage)"
                Write-Host "STATE_PRE_ERROR_CODE=$($s.outbound.last_pre_actuation_error_code)"
                Write-Host "STATE_PRE_ERROR_STAGE=$($s.outbound.last_pre_actuation_error_stage)"
                Write-Host "STATE_RUNTIME_ID=$($s.conversation.runtime_id)"
              } else {
                Write-Host 'FILE_CONTENT_BEGIN'
                Get-Content $p -Raw -ErrorAction SilentlyContinue
                Write-Host 'FILE_CONTENT_END'
              }
            }
            Write-Host "FILE_END=$name"
          }

          $events = Join-Path $root 'local-watchdog-events.ndjson'
          if (Test-Path $events) {
            Write-Host 'EVENTS_TAIL_BEGIN'
            Get-Content $events -ErrorAction SilentlyContinue | Select-Object -Last 180
            Write-Host 'EVENTS_TAIL_END'
          }

          $failureDir = Join-Path $root 'local-watchdog-failures'
          Write-Host 'FAILURE_SNAPSHOTS_BEGIN'
          if (Test-Path $failureDir) {
            Get-ChildItem $failureDir -Filter '*.json' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 12 |
              ForEach-Object {
                Write-Host "FAILURE_FILE=$($_.Name)"
                Write-Host "FAILURE_WRITE_UTC=$($_.LastWriteTimeUtc.ToString('o'))"
                try {
                  $j = Get-Content $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
                  if ($j.ui) {
                    Write-Host "UI_TIMESTAMP=$($j.ui.timestamp)"
                    Write-Host "UI_PAGE_COUNT=$($j.ui.page_count)"
                    Write-Host "UI_STATE=$($j.ui.ui_state)"
                    Write-Host "UI_OBSERVATION=$($j.ui.observation)"
                    Write-Host "UI_EXACT_RUNTIME_MATCH=$($j.ui.exact_runtime_match)"
                    Write-Host "UI_CONVERSATION_PATH=$($j.ui.conversation_path)"
                    Write-Host "UI_COMPOSER_READY=$($j.ui.composer_ready)"
                    Write-Host "UI_RESPONSE_RUNNING=$($j.ui.response_running)"
                    Write-Host "UI_LOGIN_REQUIRED=$($j.ui.login_required)"
                    Write-Host "UI_CAPTCHA=$($j.ui.has_captcha)"
                    Write-Host "UI_NETWORK_ERROR=$($j.ui.has_network_error)"
                    Write-Host "UI_TRANSIENT_ERROR=$($j.ui.has_transient_error)"
                    Write-Host "UI_DRAFT_HAS_TEXT=$($j.ui.draft_has_text)"
                    Write-Host "UI_DRAFT_LENGTH=$($j.ui.draft_length)"
                    Write-Host "UI_PROBE_ERROR=$($j.ui.probe_error)"
                  }
                } catch {
                  Write-Host "FAILURE_PARSE_ERROR=$($_.Exception.Message)"
                }
              }
          }
          Write-Host 'FAILURE_SNAPSHOTS_END'