name: SC-003 Live New Chat Qualification

on:
  push:
    branches:
      - sc-003-new-chat-bootstrap
    paths:
      - '.github/workflows/supervisor-sc003-live-qualification.yml'
      - '.github/scripts/supervisor-sc003-live-qualification.ps1'
      - '.github/scripts/supervisor-sc003-live-qualification.mjs'
      - 'src/runtime/single-conversation-bootstrap.mjs'
      - 'src/runtime/single-conversation-state.mjs'
      - 'src/ui/playwright-adapter.mjs'
      - 'src/ui/actions.mjs'
      - 'src/ui/latest-turn.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 12
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check SC-003 live harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-sc003-live-qualification.mjs"
      - name: Run target-guarded SC-003 attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc003-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 12
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check SC-003 live harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-sc003-live-qualification.mjs"
      - name: Run target-guarded SC-003 attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc003-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs:
      - attempt-1
      - attempt-2
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require real target-machine SC-003 PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC003_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC003_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC003_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC003_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'SC-003 has no successful live qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC003_LIVE_AUTHORITY_GATE=PASS'
