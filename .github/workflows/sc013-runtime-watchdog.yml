name: SC-013 Runtime Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/sc013-watchdog-request.json'

permissions:
  contents: read

concurrency:
  group: sc013-runtime-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Sample production runtime and capture first failure
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc013-runtime-watchdog.ps1" -TargetComputer "DESKTOP-H4A16IL" -NonTargetHoldSeconds 0 -MaxPreparedSeconds 180 -MaxEnqueuedSeconds 180
          exit /b %ERRORLEVEL%