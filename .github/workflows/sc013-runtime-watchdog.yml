name: SC-013 Runtime Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc013-runtime-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Sample production runtime and capture first failure
        shell: cmd
        run: |
          @echo off
          echo SC013_WATCHDOG_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc013-runtime-watchdog.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 5 -MaxPreparedSeconds 180 -MaxEnqueuedSeconds 180
          exit /b %ERRORLEVEL%
