name: SC-007 Control Center Qualification

on:
  push:
    branches:
      - sc-007-control-center-simplification
    paths:
      - '.github/workflows/supervisor-sc007-control-center-qualification.yml'
      - '.github/scripts/supervisor-sc007-control-center-qualification.ps1'
      - 'windows/control-panel.ps1'
      - 'windows/lifecycle-truth.ps1'
      - 'windows/run-supervisor.ps1'
      - 'src/runtime/single-conversation-cli.mjs'
      - 'test/control-panel-single-conversation.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc007-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 8
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Qualify SC-007 target attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc007-control-center-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 45
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 8
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Qualify SC-007 target attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc007-control-center-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 45
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs:
      - attempt-1
      - attempt-2
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require target-machine SC-007 PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          Write-Host "SC007_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC007_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC007_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC007_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          if (-not $qualified) {
            throw 'SC-007 has no successful isolated qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC007_QUALIFICATION_AUTHORITY=PASS'
