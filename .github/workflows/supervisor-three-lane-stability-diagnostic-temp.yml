name: Supervisor Three-Lane Stability Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-three-lane-stability-diagnostic-temp.yml
      - .github/scripts/diag-three-lane-stability.ps1

permissions:
  contents: read

jobs:
  stability:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard in CMD and inspect only DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo DIAG_SLOT=${{ matrix.slot }}
          echo DIAG_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\diag-three-lane-stability.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
