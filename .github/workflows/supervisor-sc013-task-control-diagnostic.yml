name: SC-013 Production Task-Control Diagnostic

on:
  push:
    branches:
      - sc013-task-control-production-diagnostic
    paths:
      - '.github/scripts/supervisor-sc013-task-control-diagnostic.mjs'
      - '.github/scripts/supervisor-sc013-task-control-diagnostic.ps1'
      - '.github/workflows/supervisor-sc013-task-control-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-1:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect production response read-only
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\\scripts\\supervisor-sc013-task-control-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 120

  inspect-2:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect production response read-only
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\\scripts\\supervisor-sc013-task-control-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 120
