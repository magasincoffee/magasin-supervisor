name: SC-013 Post-276 Evidence TEMP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sc013-post276-evidence-temp.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read exact post-276 failure evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "EVIDENCE_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') {
            Write-Host 'EVIDENCE_TARGET_MATCH=False'
            exit 0
          }
          Write-Host 'EVIDENCE_TARGET_MATCH=True'
          . '.\windows\state-root.ps1'
          $root = Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          foreach ($name in @('start-attempt-status.json','wrapper-startup.stdout.log','wrapper-startup.stderr.log','single-conversation-state.json','local-watchdog-status.json')) {
            $p = Join-Path $root $name
            Write-Host "FILE_BEGIN=$name"
            if (-not (Test-Path $p)) {
              Write-Host 'FILE_EXISTS=False'
              Write-Host "FILE_END=$name"
              continue
            }
            Write-Host 'FILE_EXISTS=True'
            $item = Get-Item $p
            Write-Host "FILE_CREATED_UTC=$($item.CreationTimeUtc.ToString('o'))"
            Write-Host "FILE_WRITE_UTC=$($item.LastWriteTimeUtc.ToString('o'))"
            if ($name -like 'wrapper-startup.*.log') {
              Write-Host 'FILE_TAIL_BEGIN'
              Get-Content $p -ErrorAction SilentlyContinue | Select-Object -Last 160
              Write-Host 'FILE_TAIL_END'
            } elseif ($name -eq 'single-conversation-state.json') {
              $s = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host "STATE_UPDATED_AT=$($s.updated_at)"
              Write-Host "STATE_AUTOMATION=$($s.automation.status)"
              Write-Host "STATE_PHASE=$($s.automation.phase)"
              Write-Host "STATE_REASON=$($s.automation.reason)"
              Write-Host "STATE_OUTBOUND=$($s.outbound.state)"
              Write-Host "STATE_KIND=$($s.outbound.kind)"
              Write-Host "STATE_RETRY_COUNT=$($s.outbound.retry_count)"
              Write-Host "STATE_LAST_ERROR_CODE=$($s.outbound.last_error_code)"
              Write-Host "STATE_LAST_ERROR_STAGE=$($s.outbound.last_error_stage)"
              Write-Host "STATE_PRE_ERROR_CODE=$($s.outbound.last_pre_actuation_error_code)"
              Write-Host "STATE_PRE_ERROR_STAGE=$($s.outbound.last_pre_actuation_error_stage)"
            } else {
              Write-Host 'FILE_CONTENT_BEGIN'
              Get-Content $p -Raw -ErrorAction SilentlyContinue
              Write-Host 'FILE_CONTENT_END'
            }
            Write-Host "FILE_END=$name"
          }
          $events = Join-Path $root 'local-watchdog-events.ndjson'
          if (Test-Path $events) {
            Write-Host 'EVENTS_TAIL_BEGIN'
            Get-Content $events -ErrorAction SilentlyContinue | Select-Object -Last 160
            Write-Host 'EVENTS_TAIL_END'
          }