name: SC-013 H4A16IL Safe Staged Deploy

# Stage requests are read-only against production. Apply is workflow_dispatch
# only, with exact main SHA, unchanged live source and explicit safety gates.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage (safe default) or Apply (separately authorized)
        type: choice
        options: [Stage, Apply, Package]
        required: true
        default: Stage
      deploy_sha:
        description: Exact current canonical main SHA (40 hex chars)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/sc013-h4a16il-stage-request.json'

  pull_request:
    paths:
      - '.github/workflows/sc013-h4a16il-safe-deploy.yml'
      - '.github/scripts/sc013-h4-supervisor-package-stage.ps1'
      - 'test/h4-supervisor-package-stage.test.mjs'

permissions:
  contents: read

concurrency:
  group: sc013-h4a16il-safe-deploy
  cancel-in-progress: false

jobs:
  stage-or-apply:
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.mode != 'Package')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Reject wrong self-hosted runner before checkout
        shell: powershell
        run: |
          if ([Environment]::MachineName -ne 'DESKTOP-H4A16IL') {
            Write-Host 'TARGET_MUTATION_SKIPPED=True'
            throw 'WRONG_TARGET_MACHINE'
          }
          Write-Host 'TARGET_MATCH=True'
      - name: Checkout exact requested canonical main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha || github.sha }}
          fetch-depth: 1
      - name: Stage verified source or perform separately gated apply
        shell: powershell
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
          DEPLOY_MODE: ${{ github.event_name == 'push' && 'Stage' || inputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_SHA -notmatch '^[a-fA-F0-9]{40}$') {
            throw 'INVALID_DEPLOY_SHA'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:DEPLOY_MODE -ne 'Stage') {
            throw 'PUSH_IS_STAGE_ONLY'
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.github/scripts/sc013-h4a16il-safe-stage-deploy.ps1' -Mode $env:DEPLOY_MODE -ExpectedMainSha $env:DEPLOY_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'SC013_H4_SAFE_DEPLOY_FAILED'
          }

  package-contract:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source-only H4 package synthetic contracts
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.github/scripts/sc013-h4-supervisor-package-stage.ps1'),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) { throw 'PACKAGE_POWERSHELL_PARSE_FAILED' }
          node --test test/h4-supervisor-package-stage.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PACKAGE_NEGATIVE_TESTS_FAILED' }
      - name: Publish PR-only review ZIP (hosted, never H4)
        shell: cmd
        run: |
          @echo off
          git archive --format=zip --output="%RUNNER_TEMP%\supervisor-source-candidate.zip" HEAD -- src windows package.json README.md SOURCE_OF_TRUTH.md
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: supervisor-pr-review-${{ github.sha }}
          path: ${{ runner.temp }}\supervisor-source-candidate.zip
          if-no-files-found: error
          retention-days: 7

  package-build:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'Package'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PACKAGE_SHA: ${{ inputs.deploy_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build canonical allowlisted source archive on hosted Windows
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.github/scripts/sc013-h4-supervisor-package-stage.ps1' -Mode Build -ExpectedMainSha $env:PACKAGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'HOSTED_PACKAGE_BUILD_FAILED' }
          Copy-Item -LiteralPath '.github/scripts/sc013-h4-supervisor-package-stage.ps1' -Destination (Join-Path $env:RUNNER_TEMP 'h4-package\sc013-h4-supervisor-package-stage.ps1')
      - uses: actions/upload-artifact@v4
        with:
          name: h4-supervisor-source-${{ env.PACKAGE_SHA }}
          path: ${{ runner.temp }}\h4-package\
          if-no-files-found: error
          retention-days: 14

  package-on-h4:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'Package'
    needs: package-build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PACKAGE_SHA: ${{ inputs.deploy_sha }}
      PRIVATE_STAGE: D:\MAGASIN_ROBOTS\supervisor-reinstall-backup-20261017\h4-package-stage
    steps:
      - name: Verify H4 machine and low-privilege service BEFORE download (NO checkout)
        shell: cmd
        run: |
          @echo off
          echo TARGET=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-H4A16IL" (
            echo TARGET_MUTATION_SKIPPED=True
            exit /b 1
          )
          whoami /user | findstr /C:"S-1-5-20" >nul
          if errorlevel 1 (
            echo NETWORK_SERVICE_REQUIRED=True
            exit /b 1
          )
          echo TARGET_MATCH=True
          echo RUNNER_IDENTITY_MATCH=True
      - name: Reject inherited or public D stage BEFORE download
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$r=$env:PRIVATE_STAGE; $p=Split-Path $r -Parent; if (!(Test-Path -LiteralPath $r -PathType Container) -or !(Test-Path -LiteralPath $p -PathType Container)) { exit 1 }; foreach($v in @($r,$p)) { $i=Get-Item -LiteralPath $v -Force; $a=Get-Acl -LiteralPath $v; if (($i.Attributes -band [IO.FileAttributes]::ReparsePoint) -or !$a.AreAccessRulesProtected) { exit 2 }; $allowed=if($v -eq $r){@('NT AUTHORITY\NETWORK SERVICE','NT AUTHORITY\SYSTEM','BUILTIN\Administrators','DESKTOP-H4A16IL\admin')}else{@('NT AUTHORITY\SYSTEM','BUILTIN\Administrators','DESKTOP-H4A16IL\admin')}; foreach($ace in $a.Access){if($ace.AccessControlType -ne 'Allow' -or $ace.IdentityReference.ToString() -notin $allowed){exit 3}}}; Write-Output 'PRIVATE_D_ACL_PREFLIGHT_PASS=True'"
          if errorlevel 1 exit /b 1
      - name: Download trusted same-workflow artifact directly to private D stage
        uses: actions/download-artifact@v4
        with:
          name: h4-supervisor-source-${{ env.PACKAGE_SHA }}
          path: ${{ env.PRIVATE_STAGE }}\${{ env.PACKAGE_SHA }}
      - name: Check D private-stage ACL and ZIP SHA before any install
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%PRIVATE_STAGE%\%PACKAGE_SHA%\sc013-h4-supervisor-package-stage.ps1" -Mode Verify -ExpectedMainSha "%PACKAGE_SHA%"
          if errorlevel 1 exit /b 1
          echo NO_C_RUNTIME_MUTATION=True
          echo NO_SUPERVISOR_START=True
