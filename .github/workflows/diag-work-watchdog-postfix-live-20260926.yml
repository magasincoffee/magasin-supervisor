name: Post-fix Work Watchdog Live Diagnostic

on:
  push:
    branches:
      - diag/work-watchdog-postfix-live-20260926
    paths:
      - .github/workflows/diag-work-watchdog-postfix-live-20260926.yml
      - .github/scripts/diag-work-watchdog-postfix-live.ps1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guard and read live watchdog state
        shell: cmd
        run: |
          @echo off
          echo DIAG_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\diag-work-watchdog-postfix-live.ps1"
          exit /b %ERRORLEVEL%
