name: PE-007 Final Planner Executor Qualification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-pe007-live-qualification.yml'
      - '.github/scripts/supervisor-pe007-live-qualification.ps1'
      - '.github/scripts/supervisor-pe007-live-qualification.mjs'
      - 'src/runtime/planner-executor.mjs'
      - 'src/runtime/planner-executor-automation.mjs'
      - 'src/runtime/planner-executor-session.mjs'
      - 'src/runtime/machine-frame.mjs'
      - 'src/runtime/latest-machine-turn.mjs'
      - 'src/ui/latest-turn.mjs'
      - 'src/ui/actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded qualification attempt 1
        id: qualify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'DESKTOP-4K7IM13'
          Write-Host "PE007_AUTH_ATTEMPT=1"
          Write-Host "PE007_AUTH_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne $target) {
            "target_match=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "qualified=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'PE007_AUTH_TARGET_MATCH=False'
            Write-Host 'PE007_AUTH_NON_TARGET_HOLD=True'
            Start-Sleep -Seconds 120
            exit 0
          }
          "target_match=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'PE007_AUTH_TARGET_MATCH=True'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-live-qualification.ps1" -TargetComputer "$target" -NonTargetHoldSeconds 0
          if ($LASTEXITCODE -ne 0) { throw "Target qualification failed with exit code $LASTEXITCODE" }
          "qualified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'PE007_AUTH_QUALIFIED=True'

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded qualification attempt 2
        id: qualify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'DESKTOP-4K7IM13'
          Write-Host "PE007_AUTH_ATTEMPT=2"
          Write-Host "PE007_AUTH_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne $target) {
            "target_match=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "qualified=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'PE007_AUTH_TARGET_MATCH=False'
            Write-Host 'PE007_AUTH_NON_TARGET_HOLD=True'
            Start-Sleep -Seconds 120
            exit 0
          }
          "target_match=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'PE007_AUTH_TARGET_MATCH=True'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-live-qualification.ps1" -TargetComputer "$target" -NonTargetHoldSeconds 0
          if ($LASTEXITCODE -ne 0) { throw "Target qualification failed with exit code $LASTEXITCODE" }
          "qualified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'PE007_AUTH_QUALIFIED=True'

  qualification-authority:
    if: always()
    needs:
      - attempt-1
      - attempt-2
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Require at least one real target qualification PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "PE007_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "PE007_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "PE007_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "PE007_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'PE-007 has no successful qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'PE007_AUTHORITY_GATE=PASS'
