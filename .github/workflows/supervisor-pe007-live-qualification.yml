name: PE-007 Final Planner Executor Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded qualification attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-authority-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run target-guarded qualification attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-pe007-authority-attempt.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 120
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs:
      - attempt-1
      - attempt-2
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main for qualification evidence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require at least one real target qualification PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "PE007_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "PE007_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "PE007_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "PE007_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'PE-007 has no successful qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'PE007_AUTHORITY_GATE=PASS'

      - name: Persist authoritative PE-007 qualification result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'Refusing to persist PE-007 evidence without target PASS.'
          }

          $dir = Join-Path $env:GITHUB_WORKSPACE '.github\qualification'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir 'pe007-latest.json'
          $payload = [ordered]@{
            schema = 'pe007-live-qualification-result.v1'
            status = 'PASS'
            candidate_sha = '${{ github.sha }}'
            workflow_run_id = [int64]'${{ github.run_id }}'
            workflow_run_number = [int]'${{ github.run_number }}'
            target_computer = 'DESKTOP-4K7IM13'
            attempt_1 = [ordered]@{
              target_match = ($a1Match -eq 'true')
              qualified = ($a1Pass -eq 'true')
            }
            attempt_2 = [ordered]@{
              target_match = ($a2Match -eq 'true')
              qualified = ($a2Pass -eq 'true')
            }
            production_cutover = $false
            recorded_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          [System.IO.File]::WriteAllText(
            $path,
            ($payload | ConvertTo-Json -Depth 8) + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/qualification/pe007-latest.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'PE007_QUALIFICATION_EVIDENCE_UNCHANGED=True'
            exit 0
          }
          git commit -m "evidence(pe-007): record authoritative live qualification PASS"
          git push origin HEAD:main
          Write-Host 'PE007_QUALIFICATION_EVIDENCE_PERSISTED=True'
