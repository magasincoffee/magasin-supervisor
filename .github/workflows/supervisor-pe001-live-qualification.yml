name: PE-001 Live Planner Executor Qualification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-pe001-live-qualification.yml'
      - '.github/scripts/supervisor-pe001-live-qualification.ps1'
      - '.github/scripts/supervisor-pe001-live-qualification.mjs'
      - 'src/runtime/planner-executor.mjs'
      - 'src/ui/latest-turn.mjs'
      - 'src/ui/actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qualification:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 12

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run isolated two-normal-chat live qualification
        shell: cmd
        run: |
          @echo off
          echo PE001_QUAL_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\pe001-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
