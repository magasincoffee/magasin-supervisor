name: Supervisor Control Panel Deploy DESKTOP-4K7IM13

# SC-013 production boundary:
# ordinary source/test/windows merges are CI only and must never replace a live
# production runtime. Production installation requires an explicit dispatch or
# a dedicated deploy-request marker commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/production-deploy-request.json'

concurrency:
  group: supervisor-live-target-deploy-desktop-4k7im13
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  pin-target-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind exact production runner label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUNNER_NAME: DESKTOP-4K7IM13
          TARGET_RUNNER_LABEL: magasin-target-desktop-4k7im13
        run: |
          set -euo pipefail

          mapfile -t target_rows < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --paginate \
              --jq ".runners[] | select(.name == \"${TARGET_RUNNER_NAME}\") | [.id,.status,.busy] | @tsv"
          )

          if [ "${#target_rows[@]}" -ne 1 ]; then
            echo "TARGET_RUNNER_RESOLUTION_FAILED=True"
            echo "TARGET_RUNNER_MATCH_COUNT=${#target_rows[@]}"
            exit 1
          fi

          IFS=$'\t' read -r target_id target_status target_busy <<< "${target_rows[0]}"
          echo "TARGET_RUNNER_ID=${target_id}"
          echo "TARGET_RUNNER_STATUS=${target_status}"
          echo "TARGET_RUNNER_BUSY=${target_busy}"

          if [ "${target_status}" != "online" ]; then
            echo "TARGET_RUNNER_OFFLINE=True"
            exit 1
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runners/${target_id}/labels" \
            --input - <<JSON
          {"labels":["${TARGET_RUNNER_LABEL}"]}
          JSON

          gh api "repos/${GITHUB_REPOSITORY}/actions/runners/${target_id}" \
            --jq '.labels[].name' | grep -Fx "${TARGET_RUNNER_LABEL}"

          echo "TARGET_RUNNER_LABEL_BOUND=True"

  deploy-panel:
    needs: pin-target-runner
    runs-on:
      - self-hosted
      - magasin-target-desktop-4k7im13
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy exact main to DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo DEPLOY_MACHINE=%COMPUTERNAME%
          echo DEPLOY_TRIGGER=${{ github.event_name }}
          echo DEPLOY_SHA=${{ github.sha }}
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_MUTATION_SKIPPED=True
            echo ERROR=Explicit production deploy landed on a non-target runner.
            exit /b 1
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\update-latest-clean-old.ps1" -TargetComputer "DESKTOP-4K7IM13" -ExpectedMainSha "${{ github.sha }}"
          exit /b %ERRORLEVEL%

# Read-only SC-013 diagnostics are intentionally separate from deployment.
# update-latest-clean-old.ps1 can close the dedicated Chrome during installation,
# so an immediate CDP diagnostic here would create a false deployment failure.
