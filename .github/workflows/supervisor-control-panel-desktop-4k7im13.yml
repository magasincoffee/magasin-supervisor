name: Supervisor Control Panel Deploy DESKTOP-4K7IM13

# SC-013 production boundary:
# ordinary source/test/windows merges are CI only and must never replace a live
# production runtime. Production installation requires an explicit dispatch or
# a dedicated deploy-request marker commit.
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact authorized main SHA to deploy across bounded reroutes
        required: false
        type: string
      routing_attempt:
        description: Internal bounded target-routing attempt
        required: false
        default: '1'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-deploy-request.json'

concurrency:
  group: supervisor-live-target-deploy-desktop-4k7im13
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy-panel:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.inputs.deploy_sha || github.sha }}
      ROUTING_ATTEMPT: ${{ github.event.inputs.routing_attempt || '1' }}
      TARGET_COMPUTER: DESKTOP-4K7IM13
      MAX_ROUTING_ATTEMPTS: '12'
      DEPLOY_WORKFLOW_FILE: supervisor-control-panel-desktop-4k7im13.yml

    steps:
      - name: Route to exact production target
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $machine = [Environment]::MachineName
          $attempt = [int]$env:ROUTING_ATTEMPT
          $maxAttempts = [int]$env:MAX_ROUTING_ATTEMPTS

          Write-Host "DEPLOY_MACHINE=$machine"
          Write-Host "DEPLOY_TRIGGER=${{ github.event_name }}"
          Write-Host "DEPLOY_SHA=$env:DEPLOY_SHA"
          Write-Host "TARGET_ROUTING_ATTEMPT=$attempt/$maxAttempts"

          if ($machine -ieq $env:TARGET_COMPUTER) {
              Write-Host "TARGET_MATCH=True"
              Write-Host "TARGET_ROUTING_COMPLETE=True"
              exit 0
          }

          Write-Host "TARGET_MATCH=False"
          Write-Host "TARGET_MUTATION_SKIPPED=True"

          if ($attempt -ge $maxAttempts) {
              Write-Host "TARGET_ROUTING_EXHAUSTED=True"
              Write-Error "Exact production runner was not selected within the bounded routing budget."
              exit 1
          }

          $nextAttempt = $attempt + 1
          $delaySeconds = [Math]::Min(60, 15 * $attempt)
          Write-Host "TARGET_ROUTING_BACKOFF_SECONDS=$delaySeconds"
          Start-Sleep -Seconds $delaySeconds

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
              ref = 'main'
              inputs = @{
                  deploy_sha = $env:DEPLOY_SHA
                  routing_attempt = [string]$nextAttempt
              }
          } | ConvertTo-Json -Depth 4

          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/$env:DEPLOY_WORKFLOW_FILE/dispatches"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

          Write-Host "TARGET_RETRY_DISPATCHED=True"
          Write-Host "TARGET_NEXT_ROUTING_ATTEMPT=$nextAttempt"
          exit 1

      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Deploy exact main to DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo DEPLOY_MACHINE=%COMPUTERNAME%
          echo DEPLOY_TRIGGER=${{ github.event_name }}
          echo DEPLOY_SHA=%DEPLOY_SHA%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_MUTATION_SKIPPED=True
            echo ERROR=Explicit production deploy reached a non-target runner after routing.
            exit /b 1
          )
          echo TARGET_MATCH=True
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\update-latest-clean-old.ps1" -TargetComputer "DESKTOP-4K7IM13" -ExpectedMainSha "%DEPLOY_SHA%"
          exit /b %ERRORLEVEL%

# Read-only SC-013 diagnostics are intentionally separate from deployment.
# update-latest-clean-old.ps1 can close the dedicated Chrome during installation,
# so an immediate CDP diagnostic here would create a false deployment failure.
