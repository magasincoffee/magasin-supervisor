name: Supervisor Control Panel Deploy DESKTOP-4K7IM13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-control-panel-desktop-4k7im13.yml
      - .github/scripts/update-latest-clean-old.ps1
      - windows/install-supervisor.ps1

permissions:
  contents: read

jobs:
  deploy-panel:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update current version on DESKTOP-4K7IM13
        shell: cmd
        run: |
          @echo off
          echo DEPLOY_SLOT=${{ matrix.slot }}
          echo DEPLOY_MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\update-latest-clean-old.ps1" -TargetComputer "DESKTOP-4K7IM13" -ExpectedMainSha "${{ github.sha }}"
          exit /b %ERRORLEVEL%
