name: SC-013 START Lifecycle Diagnostic TEMP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sc013-start-lifecycle-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read lifecycle evidence only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "DIAG_SLOT=${{ matrix.slot }}"
          Write-Host "DIAG_MACHINE=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13') {
            Write-Host 'DIAG_TARGET_MATCH=False'
            exit 0
          }
          Write-Host 'DIAG_TARGET_MATCH=True'

          . ".\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          Write-Host "DIAG_ROOT=$root"
          Write-Host "DIAG_NOW_UTC=$([DateTimeOffset]::UtcNow.ToString('o'))"

          foreach ($name in @(
            'STOP',
            'AUTOSTART_DISABLED',
            'supervisor.pid',
            'start-attempt-status.json',
            'wrapper-startup.stdout.log',
            'wrapper-startup.stderr.log',
            'single-conversation-state.json',
            'local-watchdog-status.json'
          )) {
            $p = Join-Path $root $name
            Write-Host "FILE_BEGIN=$name"
            Write-Host "FILE_EXISTS=$(Test-Path $p)"
            if (Test-Path $p) {
              $item = Get-Item $p
              Write-Host "FILE_CREATED_UTC=$($item.CreationTimeUtc.ToString('o'))"
              Write-Host "FILE_WRITE_UTC=$($item.LastWriteTimeUtc.ToString('o'))"
              Write-Host "FILE_LENGTH=$($item.Length)"
              if ($name -in @('STOP','AUTOSTART_DISABLED','supervisor.pid','start-attempt-status.json')) {
                Write-Host 'FILE_CONTENT_BEGIN'
                Get-Content $p -Raw -ErrorAction SilentlyContinue
                Write-Host 'FILE_CONTENT_END'
              } elseif ($name -like 'wrapper-startup.*.log') {
                Write-Host 'FILE_TAIL_BEGIN'
                Get-Content $p -ErrorAction SilentlyContinue | Select-Object -Last 80
                Write-Host 'FILE_TAIL_END'
              } elseif ($name -eq 'single-conversation-state.json') {
                try {
                  $st = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
                  Write-Host "STATE_UPDATED_AT=$($st.updated_at)"
                  Write-Host "STATE_AUTOMATION=$($st.automation.status)"
                  Write-Host "STATE_PHASE=$($st.automation.phase)"
                  Write-Host "STATE_REASON=$($st.automation.reason)"
                  Write-Host "STATE_CONVERSATION=$($st.conversation.status)"
                  Write-Host "STATE_OUTBOUND=$($st.outbound.state)"
                  Write-Host "STATE_KIND=$($st.outbound.kind)"
                  Write-Host "STATE_RETRY_COUNT=$($st.outbound.retry_count)"
                  Write-Host "STATE_LAST_ERROR=$($st.outbound.last_error_code)"
                } catch {
                  Write-Host "STATE_PARSE_ERROR=$($_.Exception.Message)"
                }
              } elseif ($name -eq 'local-watchdog-status.json') {
                try {
                  $wd = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
                  Write-Host "WATCHDOG_MODE=$($wd.mode)"
                  Write-Host "WATCHDOG_REASON=$($wd.reason)"
                  Write-Host "WATCHDOG_RECORDED_AT=$($wd.recorded_at)"
                } catch {
                  Write-Host "WATCHDOG_PARSE_ERROR=$($_.Exception.Message)"
                }
              }
            }
            Write-Host "FILE_END=$name"
          }

          Write-Host 'PROCESS_EVIDENCE_BEGIN'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('powershell.exe','pwsh.exe','node.exe','chrome.exe') -and
              $_.CommandLine -and (
                $_.CommandLine -like '*run-supervisor.ps1*' -or
                $_.CommandLine -like '*single-conversation-cli.mjs*' -or
                $_.CommandLine -like '*local-watchdog.ps1*' -or
                $_.CommandLine -like '*MAGASIN\Supervisor\browser_profile*'
              )
            } |
            Sort-Object ProcessId |
            ForEach-Object {
              Write-Host "PROC_PID=$($_.ProcessId)"
              Write-Host "PROC_PPID=$($_.ParentProcessId)"
              Write-Host "PROC_NAME=$($_.Name)"
              Write-Host "PROC_CMD=$($_.CommandLine)"
            }
          Write-Host 'PROCESS_EVIDENCE_END'

          $events = Join-Path $root 'local-watchdog-events.ndjson'
          Write-Host "EVENTS_EXISTS=$(Test-Path $events)"
          if (Test-Path $events) {
            Write-Host 'EVENTS_TAIL_BEGIN'
            Get-Content $events -ErrorAction SilentlyContinue | Select-Object -Last 80
            Write-Host 'EVENTS_TAIL_END'
          }