name: SC-011 Task-ID Continuity Qualification

on:
  push:
    branches:
      - sc011-task-id-continuity
    paths:
      - 'src/runtime/single-conversation-cli.mjs'
      - 'src/runtime/single-conversation-loop.mjs'
      - 'src/runtime/single-conversation-bootstrap.mjs'
      - 'src/ui/playwright-adapter.mjs'
      - 'test/single-conversation-cli.test.mjs'
      - 'test/single-conversation-task-protocol.test.mjs'
      - '.github/scripts/supervisor-sc011-live-qualification.ps1'
      - '.github/scripts/supervisor-sc011-live-qualification.mjs'
      - '.github/workflows/supervisor-sc011-live-qualification.yml'
      - 'SOURCE_OF_TRUTH.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc011-task-id-continuity
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run SC-011 focused unit tests
        shell: cmd
        run: |
          node --test test\single-conversation-task-protocol.test.mjs test\single-conversation-cli.test.mjs
      - name: Syntax-check live harness
        shell: cmd
        run: |
          node --check ".github\scripts\supervisor-sc011-live-qualification.mjs"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$e=$null; [System.Management.Automation.Language.Parser]::ParseFile('.github\scripts\supervisor-sc011-live-qualification.ps1',[ref]$null,[ref]$e)|Out-Null; if($e.Count){$e|%%{Write-Error $_}; exit 1}"
      - name: Run SC-011 target attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 60
          exit /b %ERRORLEVEL%

  attempt-2:
    needs: attempt-1
    if: always() && needs.attempt-1.outputs.qualified != 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run SC-011 focused unit tests
        shell: cmd
        run: |
          node --test test\single-conversation-task-protocol.test.mjs test\single-conversation-cli.test.mjs
      - name: Run SC-011 target attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 60
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require real target-machine SC-011 PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC011_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC011_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC011_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC011_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'SC-011 has no successful restart-continuity qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC011_QUALIFICATION_AUTHORITY=PASS'
