name: Supervisor Lifecycle Single-Writer Repair Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supervisor-lifecycle-single-writer-repair-temp.yml
      - .github/scripts/deploy-lifecycle-single-writer-repair.ps1

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1,2,3,4,5,6]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair only DESKTOP-4K7IM13 while all lanes are stopped
        shell: cmd
        run: |
          @echo off
          echo SLOT=${{ matrix.slot }}
          echo MACHINE=%COMPUTERNAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-4K7IM13" (
            echo TARGET_MATCH=False
            echo TARGET_SKIP_SAFE=True
            exit /b 0
          )
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\deploy-lifecycle-single-writer-repair.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%
