name: Supervisor P2 Live Preflight Temp

on:
  push:
    branches:
      - hotfix/supervisor-autonomy-selfheal-v1
    paths:
      - .github/workflows/supervisor-p2-live-preflight-temp.yml
      - .github/scripts/supervisor-p2-live-preflight.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-p2-live-preflight-temp
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect local Supervisor P2 preconditions read-only
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-p2-live-preflight.ps1"
