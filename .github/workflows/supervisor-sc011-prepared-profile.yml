name: SC-011 Prepared State Profile

on:
  push:
    branches:
      - sc011-production-runtime-diagnostic-20260929
    paths:
      - '.github/scripts/supervisor-sc011-prepared-profile.mjs'
      - '.github/scripts/supervisor-sc011-prepared-profile.ps1'
      - '.github/workflows/supervisor-sc011-prepared-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc011-prepared-profile
  cancel-in-progress: true

jobs:
  profile:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Profile prepared-state UI helpers on target
        shell: cmd
        run: |
          @echo off
          echo SC011_PROFILE_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc011-prepared-profile.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%
