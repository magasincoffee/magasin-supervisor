name: Runtime ChatGPT Fix Live Validation

on:
  push:
    branches:
      - rbt-runtime-chatgpt-open-fix-20260928
    paths:
      - src/runtime/chatgpt-bridge-page-runtime.mjs
      - src/runtime/planner-executor-bridge-cli.mjs
      - src/runtime/planner-executor-bridge-bootstrap.mjs
      - .github/workflows/runtime-chatgpt-fix-live-validation.yml

permissions:
  contents: read

concurrency:
  group: runtime-chatgpt-fix-live-validation
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Deploy branch runtime and require deep ChatGPT health
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "FIXLIVE_SLOT=${{ matrix.slot }}"
          if($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13'){
            Write-Host "FIXLIVE_TARGET_MATCH=False"
            Start-Sleep -Seconds 180
            exit 0
          }
          Write-Host "FIXLIVE_TARGET_MATCH=True"

          . ".\windows\state-root.ps1"
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $profile=Join-Path $root 'browser_profile'
          $installedStop=Join-Path $root 'runtime\windows\stop-supervisor.ps1'
          if(Test-Path $installedStop){
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $installedStop
            if($LASTEXITCODE -ne 0){throw "Installed STOP failed: $LASTEXITCODE"}
          } else {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            Set-Content -Path (Join-Path $root 'STOP') -Value 'STOP' -Encoding ascii
            Set-Content -Path (Join-Path $root 'AUTOSTART_DISABLED') -Value 'OWNER_STOP' -Encoding ascii
          }

          Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -like "*$profile*" } |
            ForEach-Object { Stop-Process -Id ([int]$_.ProcessId) -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\windows\install-supervisor.ps1" -SourceRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE -ne 0){throw "Branch runtime install failed: $LASTEXITCODE"}

          $installedCli=Join-Path $root 'runtime\src\runtime\planner-executor-bridge-cli.mjs'
          $installedPage=Join-Path $root 'runtime\src\runtime\chatgpt-bridge-page-runtime.mjs'
          $sourceCli=Join-Path $env:GITHUB_WORKSPACE 'src\runtime\planner-executor-bridge-cli.mjs'
          $sourcePage=Join-Path $env:GITHUB_WORKSPACE 'src\runtime\chatgpt-bridge-page-runtime.mjs'
          $cliHash=(Get-FileHash $installedCli -Algorithm SHA256).Hash
          $cliSourceHash=(Get-FileHash $sourceCli -Algorithm SHA256).Hash
          $pageHash=(Get-FileHash $installedPage -Algorithm SHA256).Hash
          $pageSourceHash=(Get-FileHash $sourcePage -Algorithm SHA256).Hash
          Write-Host "FIXLIVE_CLI_INSTALL_MATCH=$($cliHash -eq $cliSourceHash)"
          Write-Host "FIXLIVE_PAGE_INSTALL_MATCH=$($pageHash -eq $pageSourceHash)"
          if($cliHash -ne $cliSourceHash -or $pageHash -ne $pageSourceHash){throw 'Installed runtime hash mismatch'}

          $start=Join-Path $root 'runtime\windows\start-supervisor.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $start -Hidden
          if($LASTEXITCODE -ne 0){throw "Owner START failed: $LASTEXITCODE"}

          . (Join-Path $root 'runtime\windows\lifecycle-truth.ps1')
          $pass=$false
          $lastStatus=$null
          $lastTruth=$null
          $lastCdpConv=0
          $lastCdpChat=0
          $lastBridgeAlive=0
          $lastBridgeConnected=0
          $lastBridgeChat=0
          $lastBridgeConv=0

          # Bridge send may legitimately wait up to 180 seconds for a Planner
          # response. Keep the live gate beyond that bound so it never declares
          # failure while the production runtime is still within its own SLA.
          for($i=0;$i -lt 120;$i++){
            Start-Sleep -Seconds 2
            $lastTruth=Get-LifecycleProcessTruth -Root $root
            $statusPath=Join-Path $root 'planner-executor-status.json'
            if(Test-Path $statusPath){
              try{$lastStatus=Get-Content $statusPath -Raw -Encoding UTF8 | ConvertFrom-Json}catch{$lastStatus=$null}
            }

            $lastCdpConv=0
            $lastCdpChat=0
            if($lastTruth.chrome_alive -and $lastTruth.cdp_healthy){
              $chrome=Get-LifecycleRobotChrome -Root $root
              if($chrome -and $chrome.CommandLine -match '--remote-debugging-port=(\d+)'){
                try{
                  $targets=@(Invoke-RestMethod -Uri "http://127.0.0.1:$([int]$Matches[1])/json/list" -TimeoutSec 2)
                  foreach($t in $targets){
                    try{
                      $u=[Uri]([string]$t.url)
                      if($u.Host -eq 'chatgpt.com'){
                        $lastCdpChat++
                        if($u.AbsolutePath.StartsWith('/c/')){$lastCdpConv++}
                      }
                    }catch{}
                  }
                }catch{}
              }
            }

            $lastBridgeAlive=0
            $lastBridgeConnected=0
            $lastBridgeChat=0
            $lastBridgeConv=0
            try{
              $bs=Invoke-RestMethod -Uri 'http://127.0.0.1:5000/status' -TimeoutSec 2
              $lastBridgeAlive=if($null -ne $bs.pages_alive){[int]$bs.pages_alive}else{0}
              $lastBridgeConnected=if($null -ne $bs.pages_connected){[int]$bs.pages_connected}else{0}
              $bp=Invoke-RestMethod -Uri 'http://127.0.0.1:5000/pages' -TimeoutSec 2
              $alivePages=@($bp.pages | Where-Object { [bool]$_.alive })
              if($alivePages.Count -gt $lastBridgeAlive){$lastBridgeAlive=$alivePages.Count}
              foreach($p in $alivePages){
                try{
                  $u=[Uri]([string]$p.url)
                  if($u.Host -eq 'chatgpt.com'){
                    $lastBridgeChat++
                    if($u.AbsolutePath.StartsWith('/c/')){$lastBridgeConv++}
                  }
                }catch{}
              }
            }catch{}

            $tabs=if($lastStatus -and $null -ne $lastStatus.chatgpt_tabs){[int]$lastStatus.chatgpt_tabs}else{0}
            $phase=if($lastStatus){[string]$lastStatus.phase}else{''}
            if(
              $lastTruth.wrapper_alive -and
              $lastTruth.planner_executor_alive -and
              $lastTruth.chrome_alive -and
              $lastTruth.cdp_healthy -and
              $phase -ne 'STARTUP_FAILED' -and
              $tabs -eq 2 -and
              $lastCdpConv -eq 2 -and
              $lastBridgeAlive -eq 2
            ){
              $pass=$true
              break
            }
          }

          $owner=Get-LifecycleOwnerStopState -Root $root
          Write-Host "FIXLIVE_OWNER_STOP=$([bool]$owner.blocked)"
          Write-Host "FIXLIVE_WRAPPER=$([bool]$lastTruth.wrapper_alive)"
          Write-Host "FIXLIVE_PE=$([bool]$lastTruth.planner_executor_alive)"
          Write-Host "FIXLIVE_CHROME=$([bool]$lastTruth.chrome_alive)"
          Write-Host "FIXLIVE_CDP=$([bool]$lastTruth.cdp_healthy)"
          Write-Host "FIXLIVE_STATUS_PHASE=$([string]$lastStatus.phase)"
          Write-Host "FIXLIVE_STATUS_TABS=$([string]$lastStatus.chatgpt_tabs)"
          Write-Host "FIXLIVE_CDP_CHATGPT=$lastCdpChat"
          Write-Host "FIXLIVE_CDP_CONVERSATIONS=$lastCdpConv"
          Write-Host "FIXLIVE_BRIDGE_ALIVE=$lastBridgeAlive"
          Write-Host "FIXLIVE_BRIDGE_CONNECTED=$lastBridgeConnected"
          Write-Host "FIXLIVE_BRIDGE_CHATGPT=$lastBridgeChat"
          Write-Host "FIXLIVE_BRIDGE_CONVERSATIONS=$lastBridgeConv"

          $failurePath=Join-Path $root 'planner-executor-startup-failure.json'
          if(Test-Path $failurePath){
            try{
              $f=Get-Content $failurePath -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host "FIXLIVE_FAILURE_STAGE=$([string]$f.stage)"
              Write-Host "FIXLIVE_FAILURE_NAME=$([string]$f.error_name)"
              Write-Host "FIXLIVE_FAILURE_DIGEST=$([string]$f.error_digest)"
              Write-Host "FIXLIVE_BOOTSTRAP_RECONCILIATION=$([string]$f.bootstrap_reconciliation_state)"
              Write-Host "FIXLIVE_BOOTSTRAP_GENERATING=$([string]$f.bootstrap_snapshot_generating)"
              Write-Host "FIXLIVE_BOOTSTRAP_DIGEST_MATCH=$([string]$f.bootstrap_persisted_digest_matches_current)"
            }catch{}
          }

          if(-not $pass){throw 'Deep ChatGPT production health did not converge'}
          Write-Host "FIXLIVE_DEEP_HEALTH=PASS"
