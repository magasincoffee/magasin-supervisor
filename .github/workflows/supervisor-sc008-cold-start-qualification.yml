name: SC-008 Cold Start Failure Qualification

on:
  push:
    branches:
      - sc-008-cold-start-failure-qualification
    paths:
      - '.github/workflows/supervisor-sc008-cold-start-qualification.yml'
      - '.github/scripts/supervisor-sc008-live-qualification.ps1'
      - '.github/scripts/supervisor-sc008-live-qualification.mjs'
      - 'src/runtime/single-conversation-*.mjs'
      - 'src/ui/actions.mjs'
      - 'src/ui/playwright-adapter.mjs'
      - 'test/sc008-acceptance-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc008-cold-start-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attempt-1:
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check SC-008 harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-sc008-live-qualification.mjs"
      - name: Run SC-008 target attempt 1
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc008-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 1 -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  attempt-2:
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      target_match: ${{ steps.qualify.outputs.target_match }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: cmd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check SC-008 harness
        shell: cmd
        run: node --check ".github\scripts\supervisor-sc008-live-qualification.mjs"
      - name: Run SC-008 target attempt 2
        id: qualify
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc008-live-qualification.ps1" -TargetComputer "DESKTOP-4K7IM13" -Attempt 2 -NonTargetHoldSeconds 90
          exit /b %ERRORLEVEL%

  qualification-authority:
    if: always()
    needs: [attempt-1, attempt-2]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require real target-machine SC-008 PASS
        shell: powershell
        run: |
          $a1Match = '${{ needs.attempt-1.outputs.target_match }}'
          $a1Pass = '${{ needs.attempt-1.outputs.qualified }}'
          $a2Match = '${{ needs.attempt-2.outputs.target_match }}'
          $a2Pass = '${{ needs.attempt-2.outputs.qualified }}'
          Write-Host "SC008_AUTH_ATTEMPT1_TARGET_MATCH=$a1Match"
          Write-Host "SC008_AUTH_ATTEMPT1_QUALIFIED=$a1Pass"
          Write-Host "SC008_AUTH_ATTEMPT2_TARGET_MATCH=$a2Match"
          Write-Host "SC008_AUTH_ATTEMPT2_QUALIFIED=$a2Pass"
          $qualified = (
            ($a1Match -eq 'true' -and $a1Pass -eq 'true') -or
            ($a2Match -eq 'true' -and $a2Pass -eq 'true')
          )
          if (-not $qualified) {
            throw 'SC-008 has no successful cold-start qualification from DESKTOP-4K7IM13.'
          }
          Write-Host 'SC008_QUALIFICATION_AUTHORITY=PASS'
