name: SC-013 Read-Only Rebind Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supervisor-sc013-rebind-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: sc013-read-only-rebind-diagnostic-v2
  cancel-in-progress: true

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe target rebind without sending
        shell: cmd
        run: |
          @echo off
          echo SC013_DIAG_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-rebind-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 10
          exit /b %ERRORLEVEL%

# probe-revision: post-282-readonly-1
