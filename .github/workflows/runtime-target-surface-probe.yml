name: Runtime Target Surface Probe

on:
  push:
    branches:
      - rbt-runtime-chatgpt-open-fix-20260928
    paths:
      - .github/workflows/runtime-target-surface-probe.yml
      - .github/scripts/runtime-target-surface-probe.mjs

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Isolate and probe exact production targets
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "SURFACE_SLOT=${{ matrix.slot }}"
          if($env:COMPUTERNAME -ne 'DESKTOP-4K7IM13'){
            Write-Host "SURFACE_TARGET_MATCH=False"
            exit 0
          }
          Write-Host "SURFACE_TARGET_MATCH=True"
          . ".\windows\state-root.ps1"
          $root=Get-SupervisorStateRoot -Compatibility 'legacy-preserve'
          $stop=Join-Path $root 'runtime\windows\stop-supervisor.ps1'
          $start=Join-Path $root 'runtime\windows\start-supervisor.ps1'
          $profile=Join-Path $root 'browser_profile'
          $chromeCandidates=@(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome=$chromeCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'}

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $stop
          if($LASTEXITCODE -ne 0){throw 'Could not isolate Supervisor'}
          Start-Sleep -Seconds 1

          Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -like "*$profile*" } |
            ForEach-Object { Stop-Process -Id ([int]$_.ProcessId) -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Milliseconds 500

          $port=0
          foreach($candidate in 9222..9232){
            try{
              $listener=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,$candidate)
              $listener.Start();$listener.Stop();$port=$candidate;break
            }catch{}
          }
          if($port -eq 0){throw 'No free CDP port'}

          $proc=$null
          try{
            $proc=Start-Process -FilePath $chrome -WindowStyle Minimized -PassThru -ArgumentList @(
              '--remote-debugging-address=127.0.0.1',
              "--remote-debugging-port=$port",
              ('--user-data-dir="' + $profile + '"'),
              '--no-first-run','--no-default-browser-check','--start-minimized',
              '--disable-background-timer-throttling','--disable-backgrounding-occluded-windows',
              '--disable-renderer-backgrounding','--disable-features=CalculateNativeWinOcclusion',
              'https://chatgpt.com/'
            )
            $ready=$false
            for($i=0;$i -lt 30;$i++){
              try{
                $v=Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 1
                if($v.webSocketDebuggerUrl){$ready=$true;break}
              }catch{}
              Start-Sleep -Milliseconds 500
            }
            if(-not $ready){throw 'CDP did not become ready'}
            Write-Host "SURFACE_CDP_READY=True"
            & node ".github\scripts\runtime-target-surface-probe.mjs" $root "http://127.0.0.1:$port"
            if($LASTEXITCODE -ne 0){throw "Surface Node probe failed: $LASTEXITCODE"}
          } finally {
            Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like "*$profile*" } |
              ForEach-Object { Stop-Process -Id ([int]$_.ProcessId) -Force -ErrorAction SilentlyContinue }
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $start -Hidden
            Write-Host "SURFACE_OWNER_START_EXIT=$LASTEXITCODE"
          }

          Start-Sleep -Seconds 5
          . (Join-Path $root 'runtime\windows\lifecycle-truth.ps1')
          $truth=Get-LifecycleProcessTruth -Root $root
          Write-Host "SURFACE_AFTER_WRAPPER=$([bool]$truth.wrapper_alive)"
          Write-Host "SURFACE_AFTER_RUNTIME=$([bool]$truth.runtime_alive)"
          Write-Host "SURFACE_AFTER_CHROME=$([bool]$truth.chrome_alive)"
          Write-Host "SURFACE_AFTER_CDP=$([bool]$truth.cdp_healthy)"
          Write-Host "SURFACE_AFTER_HEALTHY=$([bool]$truth.healthy)"
          Write-Host "SURFACE_WORKFLOW=PASS"
