name: SC-013 Resume Production And Observe
on:
  push:
    branches: [sc011-production-runtime-diagnostic-20260929]
    paths:
      - '.github/scripts/supervisor-sc013-resume-observe.ps1'
      - '.github/workflows/supervisor-sc013-resume-observe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc013-resume-production-observe
  cancel-in-progress: false
jobs:
  observe:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: self-hosted
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Resume production and observe two verified cycles
        shell: cmd
        run: |
          @echo off
          echo SC013_RESUME_SLOT=${{ matrix.slot }}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\supervisor-sc013-resume-observe.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 180 -ObserveSeconds 900
          exit /b %ERRORLEVEL%
