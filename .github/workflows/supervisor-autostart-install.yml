name: Supervisor Autostart Install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - windows/**
      - test/**
      - package.json
      - .github/workflows/supervisor-autostart-install.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - windows/**
      - test/**
      - package.json
      - .github/workflows/supervisor-autostart-install.yml

permissions:
  contents: read

concurrency:
  group: supervisor-autostart-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-autostart-parity-hosted:
    name: installer-autostart-isolated
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle side effects
        shell: powershell
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify installer and autostart contracts in isolation
        shell: powershell
        run: node --test test/autostart-recovery.test.mjs test/windows-installer-upgrade.test.mjs test/windows-powershell-syntax.test.mjs test/windows-state-root-binding.test.mjs
      - name: Record zero production mutation
        shell: powershell
        run: Write-Host 'ZERO_PRODUCTION_MUTATION=True'
