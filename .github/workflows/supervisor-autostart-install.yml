            "STALE_TARGET_FIXTURE_RECONNECT_ZERO_REOPEN=True",
            "STALE_TARGET_FIXTURE_EVICTION_ZERO_REOPEN=True",
            "STALE_TARGET_FIXTURE_STOP_START_PRESERVES=True",
            "STALE_TARGET_FIXTURE_BRAIN_MISSING_BLOCKED=True",
            "STALE_TARGET_FIXTURE_OWNER_NEW_TARGET_CLEARS=True",
            "STALE_TARGET_FIXTURE_ACTIVE_STATE_PRESERVED=True",
            "STALE_TARGET_FIXTURE_WATCHDOG_BLOCKED=True",
            "STALE_TARGET_FIXTURE_RELAY_REOPEN_BLOCKED=True",
            "STALE_TARGET_FIXTURE_MISSING_NOT_FULL=True",
            "STALE_TARGET_FIXTURE_DEAD_PAGE_CLEANED=True",
            "STALE_TARGET_FIXTURE_PAGE_BUDGET_THREE=True",
