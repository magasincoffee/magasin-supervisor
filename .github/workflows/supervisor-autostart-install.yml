          $workFullOutput = & node $runtimeCli --work-full-fixture
          if ($LASTEXITCODE -ne 0) { throw "Installed Work-full rollover fixture acceptance failed" }
          $workFullOutput | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
