          $targetAfterWorkFull = Get-TargetFingerprint $configFile
          $registryAfterWorkFull = Get-RegistryTruthFingerprint $registryFile
          if ($targetAfterWorkFull -ne $targetAfterRelayRearm) {
            throw "Production Brain/Work target fingerprint changed during Work-full fixture"
          }
          if ($registryAfterWorkFull -ne $registryAfterRelayRearm) {
            throw "Production task/latch/pending Work truth changed during Work-full fixture"
          }

          $truthAfterWorkFull = Get-LifecycleProcessTruth -Root $root
          $wrapperAfterWorkFull = if ($truthAfterWorkFull.wrapper_alive) {
