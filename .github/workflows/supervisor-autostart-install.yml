# MIG-002 guard: production install/autostart jobs are inert until MIG-004/MIG-005 release gates.
name: Supervisor Autostart Install

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - windows/**
      - test/**
      - package.json
      - .github/workflows/supervisor-autostart-install.yml
      - .github/workflows/supervisor-rbt009-soak.yml
      - .github/scripts/supervisor-rbt009-soak.ps1
      - .github/scripts/supervisor-rbt009-soak-lib.ps1
      - .github/scripts/supervisor-rbt009-soak-strictmode-tests.ps1
      - .github/scripts/supervisor-release-event-validator.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-autostart-install
  cancel-in-progress: true

jobs:
  install:
    if: ${{ false }} # MIG-002: production/self-hosted execution disabled until MIG-004/MIG-005
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supervisor tests
        shell: powershell
        working-directory: .
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Snapshot lifecycle target fingerprint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $configFile = Join-Path $root "lanes.json"
          $fingerprintFile = Join-Path $env:RUNNER_TEMP "magasin-lifecycle-targets-before.sha256"

          function Get-TargetFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_CONFIG" }
            $config = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @($config.lanes | Sort-Object lane_id | ForEach-Object {
              "$([string]$_.lane_id)|$([string]$_.brain_url)|$([int]$_.brain_url_revision)|$([string]$_.work_url)|$([int]$_.work_url_revision)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          Set-Content -Path $fingerprintFile -Value (Get-TargetFingerprint $configFile) -Encoding ascii
          Write-Host "TARGET_SNAPSHOT_CREATED=True"

      - name: Install latest Supervisor runtime
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "windows/install-supervisor.ps1"

      - name: Verify checked-out Three-Lane source-of-truth
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\project-adapter.ps1"
          $state = ConvertTo-SupervisorProjectState (Read-SupervisorProjectAdapter)
          if ($state.supervisor_orchestration.mode -ne "THREE_LANE_V1") {
            throw "Project adapter does not enable THREE_LANE_V1"
          }
          if ([int]$state.supervisor_orchestration.lane_count -ne 3) {
            throw "Project adapter does not define exactly three lanes"
          }
          if ([bool]$state.supervisor_orchestration.brain_autodiscovery) {
            throw "Brain autodiscovery must be disabled in THREE_LANE_V1"
          }
          Write-Host "PROJECT_AUTONOMY=$([string]$state.autonomy)"
          Write-Host "SOURCE_OF_TRUTH_LOCAL_CHECK=True"

      - name: Register lifecycle recovery without overriding Owner STOP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "windows/install-autostart.ps1"

          $lifecycle = Join-Path $root "runtime\windows\lifecycle-truth.ps1"
          $start = Join-Path $root "runtime\windows\start-supervisor.ps1"
          if (-not (Test-Path $lifecycle)) { throw "Installed lifecycle truth helper is missing" }
          . $lifecycle

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root
          Write-Host "OWNER_STOP_LATCH=$([bool]$ownerStop.blocked)"
          Write-Host "ENABLED_LANE_COUNT=$enabledLaneCount"

          if ($ownerStop.blocked) {
            Write-Host "SUPERVISOR_START_REQUESTED=False"
            Write-Host "START_REASON=OWNER_STOP"
          } elseif ($enabledLaneCount -lt 1) {
            Write-Host "SUPERVISOR_START_REQUESTED=False"
            Write-Host "START_REASON=ALL_LANES_DISABLED"
          } else {
            powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $start -Hidden -Recovery
            if ($LASTEXITCODE -ne 0) { throw "Recovery start failed" }
            Write-Host "SUPERVISOR_START_REQUESTED=True"
            Write-Host "START_REASON=ENABLED_LANE_RECOVERY"
          }

      - name: Verify lifecycle installation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $runtime = Join-Path $root "runtime"
          $lifecycle = Join-Path $runtime "windows\lifecycle-truth.ps1"
          $configFile = Join-Path $root "lanes.json"
          $statusFile = Join-Path $root "lane-status.json"
          $fingerprintFile = Join-Path $env:RUNNER_TEMP "magasin-lifecycle-targets-before.sha256"

          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $value = (Get-ItemProperty -Path $runKey -Name "MAGASINBusinessOSAutostart" -ErrorAction Stop).MAGASINBusinessOSAutostart
          if ($value -notmatch "autostart-bootstrap\.ps1") { throw "HKCU autostart value is invalid" }

          function Get-SupervisorRuntimeVersion([string]$Path) {
            if (-not (Test-Path $Path)) { throw "Supervisor runtime source is missing" }
            $source = Get-Content $Path -Raw -Encoding UTF8
            $match = [regex]::Match($source, 'SUPERVISOR_RUNTIME_VERSION\s*=\s*"([^"]+)"')
            if (-not $match.Success) { throw "Supervisor runtime version marker is missing" }
            return [string]$match.Groups[1].Value
          }

          $sourceThreeLane = Join-Path $env:GITHUB_WORKSPACE "src\runtime\three-lane-cli.mjs"
          $runtimeThreeLane = Join-Path $runtime "src\runtime\three-lane-cli.mjs"
          $expectedVersion = Get-SupervisorRuntimeVersion -Path $sourceThreeLane
          $installedVersion = Get-SupervisorRuntimeVersion -Path $runtimeThreeLane
          if ($installedVersion -ne $expectedVersion) {
            throw "Installed Three-Lane runtime version does not match checked-out source"
          }
          Write-Host "SUPERVISOR_RUNTIME_VERSION_MATCH=True"

          function Get-TargetFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_CONFIG" }
            $config = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @($config.lanes | Sort-Object lane_id | ForEach-Object {
              "$([string]$_.lane_id)|$([string]$_.brain_url)|$([int]$_.brain_url_revision)|$([string]$_.work_url)|$([int]$_.work_url_revision)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          $beforeFingerprint = if (Test-Path $fingerprintFile) {
            (Get-Content $fingerprintFile -ErrorAction Stop | Select-Object -First 1).Trim()
          } else {
            throw "Target fingerprint snapshot is missing"
          }
          $afterFingerprint = Get-TargetFingerprint $configFile
          if ($beforeFingerprint -ne $afterFingerprint) {
            throw "Brain/Work target fingerprint changed during install"
          }
          Write-Host "TARGET_URLS_UNCHANGED=True"

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root

          if ($ownerStop.blocked -or $enabledLaneCount -lt 1) {
            Start-Sleep -Seconds 3
            $truth = Get-LifecycleProcessTruth -Root $root
            if ($truth.wrapper_alive -or $truth.three_lane_alive -or $truth.chrome_alive) {
              throw "Lifecycle-suppressed install unexpectedly started Robot processes"
            }
            if ($ownerStop.blocked) {
              Write-Host "ACCEPTANCE_F_OWNER_STOP_WINS=True"
            } else {
              Write-Host "ACCEPTANCE_A_ALL_LANES_DISABLED_NO_AUTOSTART=True"
            }
          } else {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              $truth = Get-LifecycleProcessTruth -Root $root
              if ($truth.healthy) {
                $healthy = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "Enabled lane runtime did not recover after install" }
            if (-not (Test-Path $statusFile)) { throw "Three-Lane status is missing" }
            $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$status.supervisor_runtime_version -ne $expectedVersion) {
              throw "Three-Lane status version does not match checked-out source"
            }
            if ([string]$status.persisted_state_role -ne "RECOVERY_ONLY") {
              throw "Three-Lane status is missing lifecycle recovery role"
            }
            Write-Host "SUPERVISOR_ONLINE=True"
            Write-Host "THREE_LANE_RUNTIME=True"
            Write-Host "BUSINESS_CHROME_ONLINE=True"
            Write-Host "BUSINESS_CHROME_CDP_HEALTHY=True"
          }

          Write-Host "THREE_LANE_COUNT=3"
          Write-Host "BRAIN_AUTODISCOVERY_ACTIVE=False"
          Write-Host "WORK_URL_OWNER_REQUIRED=False"
          Write-Host "WORK_URL_OWNER_EDITABLE=True"
          Write-Host "BRAIN_URL_OWNER_EDITABLE=True"
          Write-Host "BRAIN_URL_PERSISTED=True"
          Write-Host "BRAIN_URL_HOT_SWAP=True"
          Write-Host "AUTOSTART_REGISTERED=True"
          Write-Host "WINDOWS_LOGIN_BYPASS=False"

      - name: Verify Work target hot-swap fixture without production mutation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $runtime = Join-Path $root "runtime"
          $runtimeCli = Join-Path $runtime "src\runtime\three-lane-cli.mjs"
          $configFile = Join-Path $root "lanes.json"
          $lifecycle = Join-Path $runtime "windows\lifecycle-truth.ps1"

          if (-not (Test-Path $runtimeCli)) { throw "Installed Three-Lane runtime CLI is missing" }
          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          function Get-TargetFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_CONFIG" }
            $config = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @($config.lanes | Sort-Object lane_id | ForEach-Object {
              "$([string]$_.lane_id)|$([string]$_.brain_url)|$([int]$_.brain_url_revision)|$([string]$_.work_url)|$([int]$_.work_url_revision)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          $targetBefore = Get-TargetFingerprint $configFile
          $truthBefore = Get-LifecycleProcessTruth -Root $root
          $wrapperBefore = if ($truthBefore.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }

          $output = & node $runtimeCli --work-target-fixture
          if ($LASTEXITCODE -ne 0) { throw "Installed Work target fixture acceptance failed" }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "WORK_TARGET_FIXTURE_ACTIVE_PENDING=True",
            "WORK_TARGET_FIXTURE_RESTART_PENDING=True",
            "WORK_TARGET_FIXTURE_SAFE_BOUNDARY_APPLY_ONCE=True",
            "WORK_TARGET_FIXTURE_TASK_LATCH_PRESERVED=True",
            "WORK_TARGET_FIXTURE_SAME_TARGET_NO_GENERATION_CHURN=True",
            "WORK_TARGET_FIXTURE_BRAIN_DIRECTIVE_PRESERVED=True"
          )) {
            if ($output -notcontains $marker) { throw "Missing fixture marker: $marker" }
          }

          $targetAfter = Get-TargetFingerprint $configFile
          if ($targetBefore -ne $targetAfter) {
            throw "Production Brain/Work target fingerprint changed during fixture acceptance"
          }

          $truthAfter = Get-LifecycleProcessTruth -Root $root
          $wrapperAfter = if ($truthAfter.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          if ($wrapperBefore -ne $wrapperAfter) {
            throw "Fixture acceptance restarted or stopped the Supervisor wrapper"
          }

          Write-Host "WORK_TARGET_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "WORK_TARGET_FIXTURE_ACCEPTANCE=True"
          Write-Host "WORK_TARGET_PRODUCTION_CONFIG_UNCHANGED=True"
          Write-Host "WORK_TARGET_RUNTIME_PID_UNCHANGED=True"

      - name: Verify browser scheduler fixture and live page budget without production mutation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $runtime = Join-Path $root "runtime"
          $runtimeCli = Join-Path $runtime "src\runtime\three-lane-cli.mjs"
          $configFile = Join-Path $root "lanes.json"
          $statusFile = Join-Path $root "lane-status.json"
          $lifecycle = Join-Path $runtime "windows\lifecycle-truth.ps1"

          if (-not (Test-Path $runtimeCli)) { throw "Installed Three-Lane runtime CLI is missing" }
          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          function Get-TargetFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_CONFIG" }
            $config = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @($config.lanes | Sort-Object lane_id | ForEach-Object {
              "$([string]$_.lane_id)|$([string]$_.brain_url)|$([int]$_.brain_url_revision)|$([string]$_.work_url)|$([int]$_.work_url_revision)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          $targetBefore = Get-TargetFingerprint $configFile
          $truthBefore = Get-LifecycleProcessTruth -Root $root
          $wrapperBefore = if ($truthBefore.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }

          $output = & node $runtimeCli --browser-scheduler-fixture
          if ($LASTEXITCODE -ne 0) { throw "Installed browser scheduler fixture acceptance failed" }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "BROWSER_SCHEDULER_FIXTURE_DEFAULT_BUDGET_3=True",
            "BROWSER_SCHEDULER_FIXTURE_ONE_LANE=True",
            "BROWSER_SCHEDULER_FIXTURE_TWO_LANE_FAIR=True",
            "BROWSER_SCHEDULER_FIXTURE_THREE_LANE_FAIR=True",
            "BROWSER_SCHEDULER_FIXTURE_MUTATION_SINGLETON=True",
            "BROWSER_SCHEDULER_FIXTURE_PAGE_BUDGET_HARD_BOUND=True",
            "BROWSER_SCHEDULER_FIXTURE_LRU_EVICTION=True",
            "BROWSER_SCHEDULER_FIXTURE_ACTIVE_MUTATION_NOT_EVICTED=True",
            "BROWSER_SCHEDULER_FIXTURE_UNPERSISTED_ARTIFACT_GUARDED=True",
            "BROWSER_SCHEDULER_FIXTURE_REOPEN_NO_RESEND=True",
            "BROWSER_SCHEDULER_FIXTURE_DURABLE_TRUTH_UNCHANGED=True",
            "BROWSER_SCHEDULER_FIXTURE_LATCHES_SURVIVE_REOPEN=True",
            "BROWSER_SCHEDULER_FIXTURE_PENDING_WORK_PRESERVED=True"
          )) {
            if ($output -notcontains $marker) { throw "Missing browser scheduler fixture marker: $marker" }
          }

          $targetAfter = Get-TargetFingerprint $configFile
          if ($targetBefore -ne $targetAfter) {
            throw "Production Brain/Work target fingerprint changed during scheduler fixture acceptance"
          }

          $truthAfter = Get-LifecycleProcessTruth -Root $root
          $wrapperAfter = if ($truthAfter.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          if ($wrapperBefore -ne $wrapperAfter) {
            throw "Scheduler fixture acceptance restarted or stopped the Supervisor wrapper"
          }

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root
          if (-not $ownerStop.blocked -and $enabledLaneCount -gt 0) {
            $schedulerReady = $false
            for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path $statusFile) {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                if (
                  $status.scheduler -and
                  [int]$status.scheduler.page_budget -eq 3 -and
                  [int]$status.scheduler.resident_chatgpt_pages -le 3
                ) {
                  $schedulerReady = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $schedulerReady) {
              throw "Live production scheduler did not report page budget <= 3"
            }
            Write-Host "BROWSER_SCHEDULER_LIVE_PAGE_BUDGET_OK=True"
            Write-Host "BROWSER_SCHEDULER_LIVE_PAGE_BUDGET=3"
            Write-Host "BROWSER_SCHEDULER_LIVE_PAGE_COUNT=$([int]$status.scheduler.resident_chatgpt_pages)"
            Write-Host "BROWSER_SCHEDULER_LIVE_ENABLED_LANES=$enabledLaneCount"
            if ($enabledLaneCount -eq 1) {
              Write-Host "BROWSER_SCHEDULER_LIVE_ONE_LANE_MODE=True"
            }
          } else {
            Write-Host "BROWSER_SCHEDULER_LIVE_PAGE_BUDGET_SUPPRESSED_BY_LIFECYCLE=True"
          }

          Write-Host "BROWSER_SCHEDULER_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "BROWSER_SCHEDULER_FIXTURE_ACCEPTANCE=True"
          Write-Host "BROWSER_SCHEDULER_PRODUCTION_CONFIG_UNCHANGED=True"
          Write-Host "BROWSER_SCHEDULER_RUNTIME_PID_UNCHANGED=True"

      - name: Verify long-running Work watchdog fixture without production mutation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $runtime = Join-Path $root "runtime"
          $runtimeCli = Join-Path $runtime "src\runtime\three-lane-cli.mjs"
          $panelScript = Join-Path $runtime "windows\control-panel.ps1"
          $panelFixture = Join-Path $runtime "windows\control-panel-observability-fixture.ps1"
          $configFile = Join-Path $root "lanes.json"
          $statusFile = Join-Path $root "lane-status.json"
          $registryFile = Join-Path $root "lane-registry.json"
          $lifecycle = Join-Path $runtime "windows\lifecycle-truth.ps1"

          if (-not (Test-Path $runtimeCli)) { throw "Installed Three-Lane runtime CLI is missing" }
          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          function Get-TargetFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_CONFIG" }
            $config = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @($config.lanes | Sort-Object lane_id | ForEach-Object {
              "$([string]$_.lane_id)|$([string]$_.brain_url)|$([int]$_.brain_url_revision)|$([string]$_.work_url)|$([int]$_.work_url_revision)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          function Get-RegistryTruthFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_REGISTRY" }
            $registry = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @("lane-1","lane-2","lane-3" | ForEach-Object {
              $lane = $registry.lanes.$_
              "$_|$([string]$lane.task_id)|$([bool]$lane.awaiting_work)|$([string]$lane.work_url)|$([int]$lane.work_generation)|$([string]$lane.last_dispatch_id)|$([int]$lane.pending_work_url_revision)|$([string]$lane.dispatch_inflight)|$([string]$lane.relay_inflight)"
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          $targetBefore = Get-TargetFingerprint $configFile
          $registryBefore = Get-RegistryTruthFingerprint $registryFile
          $truthBefore = Get-LifecycleProcessTruth -Root $root
          $wrapperBefore = if ($truthBefore.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }

          $output = & node $runtimeCli --work-watchdog-fixture
          if ($LASTEXITCODE -ne 0) { throw "Installed Work watchdog fixture acceptance failed" }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "WORK_WATCHDOG_FIXTURE_LONG_RUNNING_NO_RELOAD=True",
            "WORK_WATCHDOG_FIXTURE_STALL_CHECK_BEFORE_RELOAD=True",
            "WORK_WATCHDOG_FIXTURE_ONE_RELOAD_MAX_PER_EPOCH=True",
            "WORK_WATCHDOG_FIXTURE_RESTART_NO_DUPLICATE_RELOAD=True",
            "WORK_WATCHDOG_FIXTURE_POST_RELOAD_POSSIBLY_STALLED=True",
            "WORK_WATCHDOG_FIXTURE_FRESH_PROGRESS_REARMED=True",
            "WORK_WATCHDOG_FIXTURE_RELOAD_COOLDOWN_ENFORCED=True",
            "WORK_WATCHDOG_FIXTURE_OWNER_STOP_BLOCKS=True",
            "WORK_WATCHDOG_FIXTURE_SECURITY_BLOCKS=True",
            "WORK_WATCHDOG_FIXTURE_IDENTITY_MISMATCH_FAIL_CLOSED=True",
            "WORK_WATCHDOG_FIXTURE_EXACT_ONCE_STATE_PRESERVED=True",
            "WORK_WATCHDOG_FIXTURE_PENDING_WORK_PRESERVED=True",
            "WORK_WATCHDOG_FIXTURE_NO_RESEND_PATH=True"
          )) {
            if ($output -notcontains $marker) { throw "Missing Work watchdog fixture marker: $marker" }
          }

          $targetAfter = Get-TargetFingerprint $configFile
          $registryAfter = Get-RegistryTruthFingerprint $registryFile
          if ($targetBefore -ne $targetAfter) {
            throw "Production Brain/Work target fingerprint changed during watchdog fixture"
          }
          if ($registryBefore -ne $registryAfter) {
            throw "Production task/latch/pending Work truth changed during watchdog fixture"
          }

          $truthAfter = Get-LifecycleProcessTruth -Root $root
          $wrapperAfter = if ($truthAfter.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          if ($wrapperBefore -ne $wrapperAfter) {
            throw "Watchdog fixture restarted or stopped the Supervisor wrapper"
          }

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root
          if (-not $ownerStop.blocked -and $enabledLaneCount -gt 0) {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path $statusFile) {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                if (
                  $status.scheduler -and
                  [int]$status.scheduler.page_budget -eq 3 -and
                  [int]$status.scheduler.resident_chatgpt_pages -le 3
                ) {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Live scheduler page budget is not healthy after watchdog fixture" }
            Write-Host "WORK_WATCHDOG_LIVE_PAGE_BUDGET_OK=True"
            Write-Host "WORK_WATCHDOG_LIVE_PAGE_COUNT=$([int]$status.scheduler.resident_chatgpt_pages)"
          } else {
            Write-Host "WORK_WATCHDOG_LIVE_PAGE_BUDGET_SUPPRESSED_BY_LIFECYCLE=True"
          }

          Write-Host "WORK_WATCHDOG_RUNTIME_ARTIFACT_FIXTURE=True"
