name: Supervisor Autostart Install

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'test/**'
      - '.github/workflows/supervisor-autostart-install.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'test/**'
      - '.github/workflows/supervisor-autostart-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-autostart-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate installer and repair contracts without production mutation
        shell: powershell
        run: |
          node --test `
            test/autostart-recovery.test.mjs `
            test/windows-installer-upgrade.test.mjs `
            test/windows-repair.test.mjs `
            test/windows-powershell-syntax.test.mjs
          Write-Host "AUTOSTART_INSTALL_CONTRACT_PASS=True"
          Write-Host "ZERO_PRODUCTION_MUTATION=True"
