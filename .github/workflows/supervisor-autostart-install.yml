          Write-Host "STALE_TARGET_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "STALE_TARGET_PRODUCTION_CONFIG_UNCHANGED=True"
          Write-Host "STALE_TARGET_PRODUCTION_TARGETS_UNCHANGED=True"
          Write-Host "STALE_TARGET_PRODUCTION_TRUTH_UNCHANGED=True"
          Write-Host "STALE_TARGET_RUNTIME_PID_UNCHANGED=True"

          function Get-ControlPanelTruthFingerprint([string]$Path) {
            if (-not (Test-Path $Path)) { return "NO_REGISTRY" }
            $registry = Get-Content $Path -Raw -Encoding UTF8 | ConvertFrom-Json
            $canonical = @("lane-1","lane-2","lane-3" | ForEach-Object {
              $lane = $registry.lanes.$_
              [ordered]@{
                lane_id = $_
                task_id = $lane.task_id
                awaiting_work = $lane.awaiting_work
                work_url = $lane.work_url
                work_generation = $lane.work_generation
                pending_work_url_revision = $lane.pending_work_url_revision
                dispatch_inflight = $lane.dispatch_inflight
                relay_inflight = $lane.relay_inflight
                task_timing = $lane.task_timing
                work_watchdog = $lane.work_watchdog
                work_rollover = $lane.work_rollover
                brain_target_health = $lane.brain_target_health
                work_target_health = $lane.work_target_health
              } | ConvertTo-Json -Compress -Depth 20
            }) -join "`n"
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
          }

          function Get-RobotCdpPageCount {
            $chrome = Get-LifecycleRobotChrome -Root $root
            if (-not $chrome -or -not $chrome.CommandLine) { return $null }
            if ($chrome.CommandLine -notmatch '--remote-debugging-port=(\d+)') { return $null }
            $port = [int]$Matches[1]
            try {
              $pages = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2
              return @($pages | Where-Object { [string]$_.type -eq "page" }).Count
            } catch {
              return $null
            }
          }

          $controlTargetBefore = Get-TargetFingerprint $configFile
          $controlTruthBefore = Get-ControlPanelTruthFingerprint $registryFile
          $controlProcessBefore = Get-LifecycleProcessTruth -Root $root
          $controlWrapperBefore = if ($controlProcessBefore.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          $controlPageCountBefore = Get-RobotCdpPageCount

          $controlOutput = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panelFixture
          if ($LASTEXITCODE -ne 0) { throw "Installed Control Panel observability fixture failed" }
          $controlOutput | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "CONTROL_PANEL_PROCESS_TRUTH_FIRST=True",
            "CONTROL_PANEL_PAGE_BUDGET_VISIBLE=True",
            "CONTROL_PANEL_LANE_TIMING_VISIBLE=True",
            "CONTROL_PANEL_EVENT_TAIL_BOUNDED=True",
            "CONTROL_PANEL_EVENT_CORRUPT_TAIL_TOLERATED=True",
            "CONTROL_PANEL_EVENT_MALFORMED_SKIPPED=True",
            "CONTROL_PANEL_EVENT_CONCURRENT_APPEND=True",
            "CONTROL_PANEL_PRIVACY_SAFE=True",
            "CONTROL_PANEL_NO_BROWSER_MUTATION=True",
            "CONTROL_PANEL_UNKNOWN_EVENT_TOLERATED=True",
            "CONTROL_PANEL_PROCESS_RESOURCE_DEGRADED_SAFE=True"
          )) {
            if ($controlOutput -notcontains $marker) {
              throw "Missing Control Panel fixture marker: $marker"
            }
          }

          $probeOutput = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panelScript -ObservabilityProbe
          if ($LASTEXITCODE -ne 0) { throw "Installed Control Panel observability probe failed" }
          $probeLine = @($probeOutput | Where-Object { [string]$_ -match '^\{' } | Select-Object -Last 1)
          if ($probeLine.Count -ne 1) { throw "Control Panel observability probe did not emit one JSON payload" }
          $probe = [string]$probeLine[0] | ConvertFrom-Json
          if ([string]$probe.schema_version -ne "control-panel-observability-probe.v1") {
            throw "Control Panel observability probe schema mismatch"
          }
          if ([int]$probe.timeline_event_count -gt 30) {
            throw "Control Panel production timeline exceeded bounded event count"
          }
          if ([int]$probe.timeline_bytes_read -gt 262144) {
            throw "Control Panel production timeline exceeded bounded byte read"
          }

          $sourceRuntime = Get-Content $runtimeCli -Raw -Encoding UTF8
          $versionMatch = [regex]::Match($sourceRuntime, 'SUPERVISOR_RUNTIME_VERSION\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) { throw "Installed runtime version not found" }
          if (
            [string]$probe.runtime_version -and
            [string]$probe.runtime_version -ne [string]$versionMatch.Groups[1].Value
          ) {
            throw "Control Panel probe runtime version does not match installed source"
          }

          $controlTargetAfter = Get-TargetFingerprint $configFile
          $controlTruthAfter = Get-ControlPanelTruthFingerprint $registryFile
          if ($controlTargetAfter -ne $controlTargetBefore) {
            throw "Production Brain/Work targets changed during Control Panel observability acceptance"
          }
          if ($controlTruthAfter -ne $controlTruthBefore) {
            throw "Production task/latch/pending/quarantine truth changed during Control Panel observability acceptance"
          }

          $controlProcessAfter = Get-LifecycleProcessTruth -Root $root
          $controlWrapperAfter = if ($controlProcessAfter.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          if ($controlWrapperAfter -ne $controlWrapperBefore) {
            throw "Control Panel observability fixture/probe restarted or stopped the Supervisor wrapper"
          }

          $controlPageCountAfter = Get-RobotCdpPageCount
          if (
            $null -ne $controlPageCountBefore -and
            $null -ne $controlPageCountAfter -and
            [int]$controlPageCountAfter -ne [int]$controlPageCountBefore
          ) {
            throw "Control Panel observability probe changed dedicated Chrome page count"
          }

          Write-Host "CONTROL_PANEL_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "CONTROL_PANEL_REAL_STATUS_EVENT_READ=True"
          Write-Host "CONTROL_PANEL_PRODUCTION_TARGETS_UNCHANGED=True"
          Write-Host "CONTROL_PANEL_PRODUCTION_TRUTH_UNCHANGED=True"
          Write-Host "CONTROL_PANEL_RUNTIME_PID_UNCHANGED=True"
          Write-Host "CONTROL_PANEL_NO_BROWSER_MUTATION=True"

          $planningFixture = Join-Path $runtime "src\runtime\brain-planning-acceptance-cli.mjs"
          if (-not (Test-Path $planningFixture)) { throw "Installed Brain planning fixture is missing" }

          $planningTargetBefore = Get-TargetFingerprint $configFile
          $planningTruthBefore = Get-ControlPanelTruthFingerprint $registryFile
          $planningProcessBefore = Get-LifecycleProcessTruth -Root $root
          $planningWrapperBefore = if ($planningProcessBefore.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }

          $planningOutput = & node.exe $planningFixture
          if ($LASTEXITCODE -ne 0) { throw "Installed Brain planning contract fixture failed" }
          $planningOutput | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "BRAIN_PLANNING_V1_BACKWARD_COMPATIBLE=True",
            "BRAIN_PLANNING_ACCEPT_CORRELATED=True",
            "BRAIN_PLANNING_REJECT_CORRELATED=True",
            "BRAIN_PLANNING_REJECT_UNRELATED_BLOCKED=True",
            "BRAIN_PLANNING_VERDICT_IDEMPOTENT=True",
            "BRAIN_PLANNING_LEGACY_HANDSHAKE_NO_DUPLICATE=True",
            "BRAIN_PLANNING_ACTIVE_DISPATCH_NO_RESEND=True",
            "BRAIN_PLANNING_WORK_STOP_GUARD=True",
            "BRAIN_PLANNING_EVENTS_PRIVACY_SAFE=True"
          )) {
            if ($planningOutput -notcontains $marker) {
              throw "Missing Brain planning fixture marker: $marker"
            }
          }

          $planningTargetAfter = Get-TargetFingerprint $configFile
          $planningTruthAfter = Get-ControlPanelTruthFingerprint $registryFile
          if ($planningTargetAfter -ne $planningTargetBefore) {
            throw "Production Brain/Work targets changed during Brain planning acceptance"
          }
          if ($planningTruthAfter -ne $planningTruthBefore) {
            throw "Production task/latch/pending/quarantine truth changed during Brain planning acceptance"
          }

          $planningProcessAfter = Get-LifecycleProcessTruth -Root $root
          $planningWrapperAfter = if ($planningProcessAfter.wrapper_alive) {
            [int](Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }
          if ($planningWrapperAfter -ne $planningWrapperBefore) {
            throw "Brain planning fixture restarted or stopped the Supervisor wrapper"
          }

          Write-Host "BRAIN_PLANNING_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "BRAIN_PLANNING_PRODUCTION_TARGETS_UNCHANGED=True"
          Write-Host "BRAIN_PLANNING_PRODUCTION_TRUTH_UNCHANGED=True"
          Write-Host "BRAIN_PLANNING_RUNTIME_PID_UNCHANGED=True"

      - name: Verify event timing foundation privacy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $eventFile = Join-Path $root "lane-events.ndjson"
          $registryFile = Join-Path $root "lane-registry.json"
          $configFile = Join-Path $root "lanes.json"
          $lifecycle = Join-Path $root "runtime\windows\lifecycle-truth.ps1"

          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle
          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root

          if ($ownerStop.blocked -or $enabledLaneCount -lt 1) {
            Write-Host "EVENT_TIMING_RUNTIME_SUPPRESSED=True"
            exit 0
          }

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path $eventFile) -and (Get-Item $eventFile).Length -gt 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "lane-events.ndjson was not created/appended by active Supervisor runtime" }

          $allowed = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]@(
              "schema_version","timestamp","lane_id","actor","event_type",
              "task_id","phase","reason_code","work_generation","work_url_revision","elapsed_ms",
              "queue_time_ms","execution_time_ms","dispatch_id","relay_id",
              "target_role","target_digest","target_revision"
            )
          )
          $recent = @(Get-Content $eventFile -Tail 200 -Encoding UTF8)
          if ($recent.Count -lt 1) { throw "lane-events.ndjson contains no events" }

          $seenStarted = @{}
          $seenRelay = @{}
          foreach ($line in $recent) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $event = $line | ConvertFrom-Json
            foreach ($property in @($event.PSObject.Properties.Name)) {
              if (-not $allowed.Contains([string]$property)) {
                throw "lane-events.ndjson contains a non-allowlisted property"
              }
            }
            $raw = [string]$line
            if ($raw -match '(?i)https?://|chatgpt\.com|brain_url|work_url|screenshot_path|attachment_path|cookie|bearer\s') {
              throw "lane-events.ndjson contains forbidden private metadata"
            }
            if ([string]$event.event_type -eq "WORK_STARTED" -and $event.dispatch_id) {
              $key = "$([string]$event.lane_id)|$([string]$event.task_id)|$([string]$event.dispatch_id)"
              if ($seenStarted.ContainsKey($key)) { throw "duplicate WORK_STARTED correlation found in recent event window" }
              $seenStarted[$key] = $true
            }
            if ([string]$event.event_type -eq "RESULT_RELAY_CONFIRMED" -and $event.relay_id) {
              $key = "$([string]$event.lane_id)|$([string]$event.task_id)|$([string]$event.relay_id)"
              if ($seenRelay.ContainsKey($key)) { throw "duplicate RESULT_RELAY_CONFIRMED correlation found in recent event window" }
              $seenRelay[$key] = $true
            }
          }

          if (-not (Test-Path $registryFile)) { throw "lane-registry.json is missing" }
          $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($laneId in @("lane-1","lane-2","lane-3")) {
            $laneState = $registry.lanes.$laneId
            if ($laneState -and -not $laneState.PSObject.Properties["task_timing"]) {
              throw "lane registry is missing additive task_timing state"
            }
          }

          Write-Host "LANE_EVENT_LOG_PRESENT=True"
          Write-Host "LANE_EVENT_ALLOWLIST_SAFE=True"
          Write-Host "LANE_EVENT_PRIVATE_CONTENT_ABSENT=True"
          Write-Host "RECENT_EVENT_CORRELATIONS_UNIQUE=True"
          Write-Host "TASK_TIMING_REGISTRY_PRESENT=True"

  verify-survival:
    if: ${{ false }} # MIG-002: production/self-hosted execution disabled until MIG-004/MIG-005
    name: verify-survival
    needs: install
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Checkout canonical Supervisor source
        uses: actions/checkout@v4

      - name: Verify lifecycle survived previous job cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 15

          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $lifecycle = Join-Path $root "runtime\windows\lifecycle-truth.ps1"
          $statusFile = Join-Path $root "lane-status.json"
          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root

          if ($ownerStop.blocked -or $enabledLaneCount -lt 1) {
            $truth = Get-LifecycleProcessTruth -Root $root
            if ($truth.wrapper_alive -or $truth.three_lane_alive -or $truth.chrome_alive) {
              throw "Runtime started even though lifecycle truth suppresses automatic boot"
            }
            if ($ownerStop.blocked) {
              Write-Host "POST_JOB_OWNER_STOP_PRESERVED=True"
            } else {
              Write-Host "POST_JOB_ALL_LANES_DISABLED=True"
            }
            exit 0
          }

          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            $truth = Get-LifecycleProcessTruth -Root $root
            if ($truth.healthy) {
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) { throw "Lifecycle did not survive/recover after previous self-hosted job" }

          function Get-SupervisorRuntimeVersion([string]$Path) {
            if (-not (Test-Path $Path)) { throw "Supervisor runtime source is missing" }
            $source = Get-Content $Path -Raw -Encoding UTF8
            $match = [regex]::Match($source, 'SUPERVISOR_RUNTIME_VERSION\s*=\s*"([^"]+)"')
            if (-not $match.Success) { throw "Supervisor runtime version marker is missing" }
            return [string]$match.Groups[1].Value
          }

          if (-not (Test-Path $statusFile)) { throw "Three-Lane status is missing after previous job cleanup" }
          $sourceThreeLane = Join-Path $env:GITHUB_WORKSPACE "src\runtime\three-lane-cli.mjs"
          $expectedVersion = Get-SupervisorRuntimeVersion -Path $sourceThreeLane
          $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$status.supervisor_runtime_version -ne $expectedVersion) {
            throw "Post-job Three-Lane runtime version does not match checked-out source"
          }
          Write-Host "POST_JOB_RUNTIME_VERSION_MATCH=True"

          Write-Host "POST_JOB_SUPERVISOR_ALIVE=True"
          Write-Host "POST_JOB_THREE_LANE_ALIVE=True"
          Write-Host "POST_JOB_ROBOT_CHROME_ALIVE=True"
          Write-Host "POST_JOB_ROBOT_CDP_HEALTHY=True"
          Write-Host "POST_JOB_LANE_COUNT=3"

      - name: Open Control Panel and verify lifecycle truth
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\windows\state-root.ps1"
          $root = Get-SupervisorStateRoot
          $lifecycle = Join-Path $root "runtime\windows\lifecycle-truth.ps1"
          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "MAGASIN BUSINESS OS CONTROL.lnk"
          if (-not (Test-Path $lifecycle)) { throw "Lifecycle truth helper is missing" }
          . $lifecycle

          $before = Get-LifecycleProcessTruth -Root $root
          $beforeWrapperPid = if ($before.wrapper_alive) {
            (Get-LifecycleSupervisorWrapper -Root $root).ProcessId
          } else { 0 }

          if (-not (Test-Path $shortcut)) { throw "Control Panel shortcut is missing" }
          Start-Process $shortcut
          Start-Sleep -Seconds 4

          $ownerStop = Get-LifecycleOwnerStopState -Root $root
          $enabledLaneCount = Get-EnabledLaneCount -Root $root
          $after = Get-LifecycleProcessTruth -Root $root

          if ($ownerStop.blocked -or $enabledLaneCount -lt 1) {
            if (-not $before.wrapper_alive -and $after.wrapper_alive) {
              throw "Opening Control Panel auto-started runtime while lifecycle truth suppresses it"
            }
          } else {
            $healthy = $after.healthy
            for ($i = 0; -not $healthy -and $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $after = Get-LifecycleProcessTruth -Root $root
              $healthy = $after.healthy
            }
            if (-not $healthy) { throw "Opening Control Panel did not recover enabled runtime" }

            if ($before.healthy -and $beforeWrapperPid) {
              $afterWrapperPid = (Get-LifecycleSupervisorWrapper -Root $root).ProcessId
              if ($afterWrapperPid -ne $beforeWrapperPid) {
                throw "Healthy runtime was restarted unnecessarily when panel opened"
              }
              Write-Host "ACCEPTANCE_E_HEALTHY_NO_REDUNDANT_RESTART=True"
            }
          }

          Write-Host "CONTROL_PANEL_OPENED=True"
          Write-Host "LIFECYCLE_SURVIVAL=True"
