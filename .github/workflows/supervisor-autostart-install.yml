          }

          $targetAfterStaleTarget = Get-TargetFingerprint $configFile
          $registryAfterStaleTarget = Get-RegistryTruthFingerprint $registryFile
          if ($targetAfterStaleTarget -ne $targetAfterWorkFull) {
