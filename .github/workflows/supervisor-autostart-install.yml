          $relayRearmOutput | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "RELAY_REARM_FIXTURE_EXHAUSTED_OWNER_REARMED=True",
            "RELAY_REARM_FIXTURE_SAME_RELAY_ID=True",
            "RELAY_REARM_FIXTURE_BOUNDED_THREE_ATTEMPTS=True",
