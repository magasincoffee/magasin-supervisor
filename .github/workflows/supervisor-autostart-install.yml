          }

          Write-Host "WORK_FULL_RUNTIME_ARTIFACT_FIXTURE=True"
          Write-Host "WORK_FULL_PRODUCTION_CONFIG_UNCHANGED=True"
          Write-Host "WORK_FULL_PRODUCTION_TARGETS_UNCHANGED=True"
          Write-Host "WORK_FULL_PRODUCTION_TRUTH_UNCHANGED=True"
          Write-Host "WORK_FULL_RUNTIME_PID_UNCHANGED=True"

          $staleTargetOutput = & node $runtimeCli --stale-target-fixture
          if ($LASTEXITCODE -ne 0) { throw "Installed stale-target quarantine fixture acceptance failed" }
          $staleTargetOutput | ForEach-Object { Write-Host $_ }

          foreach ($marker in @(
            "STALE_TARGET_FIXTURE_BEFORE_NAVIGATION_COUNT=100",
