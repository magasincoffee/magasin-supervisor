          }

          $targetAfterRelayRearm = Get-TargetFingerprint $configFile
          $registryAfterRelayRearm = Get-RegistryTruthFingerprint $registryFile
          if ($targetAfterRelayRearm -ne $targetAfter) {
            throw "Production Brain/Work target fingerprint changed during relay rearm fixture"
          }
          if ($registryAfterRelayRearm -ne $registryAfter) {
            throw "Production task/latch/pending Work truth changed during relay rearm fixture"
          }

          $truthAfterRelayRearm = Get-LifecycleProcessTruth -Root $root
          $wrapperAfterRelayRearm = if ($truthAfterRelayRearm.wrapper_alive) {
