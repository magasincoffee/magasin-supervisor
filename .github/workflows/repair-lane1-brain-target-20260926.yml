name: One-time Lane 1 Brain Target Repair 20260926

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-lane1-brain-target-20260926.yml
      - .github/scripts/repair-lane1-brain-target-20260926.ps1

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair only the known wrong lane-1 Brain target
        shell: cmd
        run: |
          @echo off
          echo REPAIR_SLOT=${{ matrix.slot }}
          echo REPAIR_MACHINE=%COMPUTERNAME%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\repair-lane1-brain-target-20260926.ps1" -TargetComputer "DESKTOP-4K7IM13"
          exit /b %ERRORLEVEL%

# recheck after live submit repair
