name: Supervisor Integrity

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-flow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enforce one production flow
        shell: bash
        run: |
          set -euo pipefail
          expected_workflows=$(printf '%s\n' \
            supervisor-control-panel-desktop-4k7im13.yml \
            supervisor-integrity.yml \
            supervisor-sc013-live-production.yml \
            supervisor-tests.yml | sort)
          actual_workflows=$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual_workflows" != "$expected_workflows" ]; then
            echo 'Unexpected workflow topology:'
            printf '%s\n' "$actual_workflows"
            exit 1
          fi

          test -f src/runtime/single-conversation-cli.mjs
          test -f src/runtime/single-conversation-state.mjs
          test -f windows/run-supervisor.ps1
          test -f windows/start-supervisor.ps1
          test -f windows/local-watchdog.ps1
          test -f .github/scripts/supervisor-sc013-live-production.ps1
          test -f .github/scripts/update-latest-clean-old.ps1

          if grep -R -nE 'THREE_LANE_V1|Planner|Executor|PE-00[17]|MBV1|Bridge qualification|Brain submit' \
            .github/workflows \
            .github/scripts/supervisor-sc013-live-production.ps1 \
            src/runtime/single-conversation-*.mjs \
            windows/run-supervisor.ps1 \
            windows/start-supervisor.ps1 \
            windows/control-panel.ps1; then
            echo 'Legacy orchestration leaked into active path'
            exit 1
          fi

          grep -q 'SINGLE_CONVERSATION_V1' windows/run-supervisor.ps1
          grep -q 'single-conversation-cli.mjs' windows/run-supervisor.ps1
          grep -q 'sc013-live-observation-request.json' .github/workflows/supervisor-sc013-live-production.yml
          grep -q 'production-deploy-request.json' .github/workflows/supervisor-control-panel-desktop-4k7im13.yml

          echo 'SC013_ONE_PRODUCTION_FLOW=True'
          echo 'SC013_LEGACY_WORKFLOWS_ABSENT=True'
          echo 'PRODUCTION_MUTATION=False'