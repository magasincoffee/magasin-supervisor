# MIG-003 hosted integrity: decoupled platform checks; self-hosted runtime audit remains hard-disabled.
name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run decoupled platform core tests
        run: |
          node --test \
            test/project-adapter.test.mjs \
            test/state-root.test.mjs \
            test/lane-events.test.mjs \
            test/browser-scheduler.test.mjs \
            test/work-watchdog.test.mjs \
            test/brain-planning-contract.test.mjs

      - name: Enforce MIG-003 decoupling invariants
        shell: bash
        run: |
          set -euo pipefail
          test -e src/runtime/three-lane-cli.mjs
          test -e windows/lifecycle-truth.ps1
          test -e docs/ROBOT_LIFECYCLE_TRUTH_ARCHITECTURE.md
          test -e docs/MIG_002_PARITY_PROVENANCE.json
          test -e .github/scripts/supervisor-integrity-registry.ps1
          test -e .github/workflows/supervisor-tests.yml

          ! grep -R --exclude='supervisor-integrity.yml' -q '08_INTEGRATIONS/supervisor' src windows .github/workflows/supervisor-*.yml
          ! grep -R --exclude='supervisor-integrity.yml' -q '01_DOCS/MAGASIN/00_PROJECT_STATE.json' src windows .github/workflows/supervisor-*.yml
          ! grep -R --exclude='supervisor-integrity.yml' -q 'magasincoffee/magasincoffee.github.io' src windows .github/workflows/supervisor-*.yml
          grep -q 'supervisor-project-adapter.v1' src/project-adapter.mjs
          grep -q 'legacy-preserve' src/state-root.mjs
          grep -q 'legacy-preserve' windows/state-root.ps1

          grep -q 'MIG-003 guard' .github/workflows/supervisor-autostart-install.yml
          grep -q 'MIG-003 guard' .github/workflows/supervisor-lifecycle-acceptance.yml
          grep -q 'production control-panel workflow remains inert' .github/workflows/supervisor-open-control-panel.yml
          grep -q 'MIG-003 guard' .github/workflows/supervisor-rbt009-soak.yml
          grep -q 'MIG-003 guard' .github/workflows/supervisor-state-maintenance.yml
          grep -q 'self-hosted runtime audit disabled until MIG-004/MIG-005' .github/workflows/supervisor-integrity.yml

          echo "MIG_003_PROJECT_ADAPTER_BOUNDARY=True"
          echo "MIG_003_STATE_ROOT_COMPATIBILITY=True"
          echo "MIG_003_ROOT_NATIVE_STATIC=True"
          echo "MIG_003_SELF_HOSTED_FAIL_CLOSED=True"
          echo "ZERO_PRODUCTION_MUTATION=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: ${{ false }} # MIG-003: self-hosted runtime audit disabled until MIG-004/MIG-005
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - run: echo "MIG-003 blocks self-hosted runtime audit."
