# MIG-003 decoupling integrity: hosted static/core checks; self-hosted runtime audit hard-disabled.
name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run decoupling contract tests
        run: |
          node --test \
            test/project-adapter.test.mjs \
            test/state-root.test.mjs \
            test/state.test.mjs \
            test/status.test.mjs \
            test/decision.test.mjs \
            test/orchestration.test.mjs \
            test/night-run.test.mjs \
            test/lane-events.test.mjs \
            test/browser-scheduler.test.mjs \
            test/work-watchdog.test.mjs \
            test/brain-planning-contract.test.mjs

      - name: Enforce MIG-003 project-neutral/root-native invariants
        shell: bash
        run: |
          set -euo pipefail
          test -e src/runtime/three-lane-cli.mjs
          test -e windows/lifecycle-truth.ps1
          test -e docs/ROBOT_LIFECYCLE_TRUTH_ARCHITECTURE.md
          test -e docs/MIG_002_PARITY_PROVENANCE.json
          test -e src/project-adapter.mjs
          test -e src/runtime/state-root.mjs
          test -e windows/state-root.ps1
          test -e .github/scripts/supervisor-integrity-registry.ps1
          test -e .github/workflows/supervisor-tests.yml

          ! grep -R -nE '00_PROJECT_STATE|00_TASK_QUEUE|CURRENT_STATE|magasincoffee/magasincoffee.github.io|08_INTEGRATIONS[/\\]supervisor|02_CORE' src windows --exclude='state-root.ps1'
          ! grep -R -nE 'MAGASIN[/\\]BusinessOS[/\\]supervisor' src --exclude='state-root.mjs'

          grep -q 'LEGACY_COMPATIBILITY' src/runtime/state-root.mjs
          grep -q 'MAGASIN_SUPERVISOR_STATE_ROOT' windows/state-root.ps1
          grep -q 'production/self-hosted execution disabled' .github/workflows/supervisor-autostart-install.yml
          grep -q 'self-hosted lifecycle mutation job is inert' .github/workflows/supervisor-lifecycle-acceptance.yml
          grep -q 'qualification workflow is inert' .github/workflows/supervisor-rbt009-soak.yml

          echo "MIG_003_DIRECT_BUSINESS_OS_COUPLING_CLOSED=True"
          echo "MIG_003_STATE_ROOT_COMPATIBILITY=True"
          echo "MIG_003_SELF_HOSTED_FAIL_CLOSED=True"
          echo "ZERO_PRODUCTION_MUTATION=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: ${{ false }} # MIG-003: self-hosted runtime audit disabled until MIG-004/MIG-005
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - run: echo "MIG-003 blocks self-hosted runtime audit."
