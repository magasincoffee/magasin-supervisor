# MIG-002 extraction-only integrity: hosted static/core checks; self-hosted runtime audit hard-disabled.
name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run extraction-safe cross-platform core tests
        run: |
          node --test \
            test/lane-events.test.mjs \
            test/browser-scheduler.test.mjs \
            test/work-watchdog.test.mjs \
            test/brain-planning-contract.test.mjs

      - name: Enforce root-native extraction invariants
        shell: bash
        run: |
          set -euo pipefail
          test -e src/runtime/three-lane-cli.mjs
          test -e windows/lifecycle-truth.ps1
          test -e docs/ROBOT_LIFECYCLE_TRUTH_ARCHITECTURE.md
          test -e docs/MIG_002_PARITY_PROVENANCE.json
          test -e .github/scripts/supervisor-integrity-registry.ps1
          test -e .github/workflows/supervisor-tests.yml

          ! grep -q '08_INTEGRATIONS/supervisor' .github/workflows/supervisor-tests.yml
          ! grep -q '01_DOCS/MAGASIN/00_PROJECT_STATE.json' .github/workflows/supervisor-tests.yml

          grep -q 'MIG-002' .github/workflows/supervisor-autostart-install.yml
          grep -q 'MIG-002' .github/workflows/supervisor-lifecycle-acceptance.yml
          grep -q 'MIG-002' .github/workflows/supervisor-open-control-panel.yml
          grep -q 'MIG-002' .github/workflows/supervisor-rbt009-soak.yml
          grep -q 'MIG-002' .github/workflows/supervisor-state-maintenance.yml
          grep -q 'MIG-002' .github/workflows/supervisor-integrity.yml

          echo "MIG_002_ROOT_NATIVE_STATIC=True"
          echo "MIG_002_SELF_HOSTED_FAIL_CLOSED=True"
          echo "ZERO_PRODUCTION_MUTATION=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: ${{ false }} # MIG-002: self-hosted runtime audit disabled until MIG-004/MIG-005
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - run: echo "MIG-002 blocks self-hosted runtime audit."
