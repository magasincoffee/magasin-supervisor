# MIG-004 hosted integrity: independent-repo static/runtime-contract parity; production runtime audit remains hard-disabled.
name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "windows/**"
      - "test/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "windows/**"
      - "test/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run decoupled platform core tests
        run: |
          node --test \
            test/project-adapter.test.mjs \
            test/state-root.test.mjs \
            test/lane-events.test.mjs \
            test/browser-scheduler.test.mjs \
            test/work-watchdog.test.mjs \
            test/brain-planning-contract.test.mjs \
            test/mig-004-isolated-lifecycle-parity.test.mjs

      - name: Validate state-maintenance and Control Panel safety contracts
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File .github/scripts/supervisor-state-maintenance-regression.ps1 \
            -WorkflowPath .github/workflows/supervisor-state-maintenance.yml \
            -HelperPath .github/scripts/supervisor-integrity-registry.ps1
          node --test test/control-panel.test.mjs test/control-panel-observability-integration.test.mjs test/supervisor-integrity-optional-latch.test.mjs

      - name: Exercise canonical latch integrity on synthetic registry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE/.github/scripts/supervisor-integrity-registry.ps1"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mig004-integrity-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $registry = [pscustomobject]@{
            lanes = [pscustomobject]@{
              "lane-1" = [pscustomobject]@{ dispatch_inflight = $null; relay_inflight = $null }
              "lane-2" = [pscustomobject]@{ dispatch_inflight = $null; relay_inflight = $null }
              "lane-3" = [pscustomobject]@{ dispatch_inflight = $null; relay_inflight = $null }
            }
          }
          Assert-SupervisorLatchIntegrity -Registry $registry -EvidenceDir $evidenceDir | Out-Null
          Write-Host "MIG_004_SYNTHETIC_LATCH_INTEGRITY=True"

      - name: Enforce MIG-004 independent-repo integrity invariants
        shell: bash
        run: |
          set -euo pipefail
          test -e src/runtime/three-lane-cli.mjs
          test -e windows/lifecycle-truth.ps1
          test -e docs/ROBOT_LIFECYCLE_TRUTH_ARCHITECTURE.md
          test -e docs/MIG_002_PARITY_PROVENANCE.json
          node -e "const p=require('./docs/MIG_002_PARITY_PROVENANCE.json'); if(!Array.isArray(p.records)||p.records.length!==137||p.records.some(x=>x.represented_exactly_once!==true)) process.exit(1); console.log('MIG_002_PROVENANCE_137_OF_137=True')"
          test -e .github/scripts/supervisor-integrity-registry.ps1
          test -e .github/workflows/supervisor-tests.yml

          ! grep -R --exclude='supervisor-integrity.yml' -q '08_INTEGRATIONS/supervisor' src windows .github/workflows/supervisor-*.yml
          ! grep -R --exclude='supervisor-integrity.yml' -q '01_DOCS/MAGASIN/00_PROJECT_STATE.json' src windows .github/workflows/supervisor-*.yml
          ! grep -R --exclude='supervisor-integrity.yml' -q 'magasincoffee/magasincoffee.github.io' src windows .github/workflows/supervisor-*.yml
          grep -q 'supervisor-project-adapter.v1' src/project-adapter.mjs
          grep -q 'legacy-preserve' src/state-root.mjs
          grep -q 'legacy-preserve' windows/state-root.ps1

          grep -q 'production/self-hosted install remains hard-disabled' .github/workflows/supervisor-autostart-install.yml
          grep -q 'production/self-hosted lifecycle remains hard-disabled' .github/workflows/supervisor-lifecycle-acceptance.yml
          grep -q 'production control-panel workflow remains inert' .github/workflows/supervisor-open-control-panel.yml
          grep -q 'MIG-006: Tier B exact-runtime qualification is owner-released and preflight-gated' .github/workflows/supervisor-rbt009-soak.yml
          grep -q 'MIG-003 guard' .github/workflows/supervisor-state-maintenance.yml
          grep -q 'production runtime audit remains hard-disabled' .github/workflows/supervisor-integrity.yml

          echo "MIG_004_INDEPENDENT_REPO_INTEGRITY=True"
          echo "MIG_004_EXACT_SHA=$GITHUB_SHA"
          echo "MIG_003_PROJECT_ADAPTER_BOUNDARY=True"
          echo "MIG_003_STATE_ROOT_COMPATIBILITY=True"
          echo "MIG_003_ROOT_NATIVE_STATIC=True"
          echo "MIG_003_SELF_HOSTED_FAIL_CLOSED=True"
          echo "ZERO_PRODUCTION_MUTATION=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: ${{ false }} # MIG-004: production runtime audit remains hard-disabled
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - run: echo "MIG-004 validates integrity on hosted runners; production runtime audit remains inert."
