name: Supervisor Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - windows/**
      - test/**
      - SOURCE_OF_TRUTH.md
      - .github/workflows/**
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - src/**
      - windows/**
      - test/**
      - SOURCE_OF_TRUTH.md
      - .github/workflows/**
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical active surface and Source of Truth authority
        run: node --test test/sc013-active-surface.test.mjs test/source-of-truth-authority.test.mjs test/sc013-legacy-orchestration-retired.test.mjs test/sc013-legacy-runtime-disabled.test.mjs test/single-conversation-state.test.mjs test/single-conversation-bootstrap.test.mjs
      - name: Reject production self-hosted test paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'runs-on:[[:space:]]*(\[[^]]*self-hosted|self-hosted)' .github/workflows/supervisor-tests.yml .github/workflows/supervisor-integrity.yml .github/workflows/supervisor-autostart-install.yml .github/workflows/supervisor-lifecycle-acceptance.yml
          echo 'SINGLE_ACTIVE_PRODUCTION_SURFACE=True'
          echo 'ZERO_PRODUCTION_MUTATION=True'
