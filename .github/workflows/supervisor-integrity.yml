# MIG-004 hosted integrity: full root-native/static gate; production runtime audit remains inert.
name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
      - "package.json"
  push:
    branches:
      - main
      - 'mig-004/**'
    paths:
      - "src/**"
      - "test/**"
      - "windows/**"
      - "docs/**"
      - ".github/scripts/supervisor-*"
      - ".github/workflows/supervisor-*.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full independent-repository suite
        run: npm test

      - name: Run state-maintenance safety regression
        shell: pwsh
        run: |
          & ".github/scripts/supervisor-state-maintenance-regression.ps1" -WorkflowPath ".github/workflows/supervisor-state-maintenance.yml" -HelperPath ".github/scripts/supervisor-integrity-registry.ps1"

      - name: Enforce MIG-004 root-native and decoupling invariants
        shell: bash
        run: |
          set -euo pipefail

          test -e src/project-adapter.mjs
          test -e src/state-root.mjs
          test -e windows/state-root.ps1
          test -e docs/PROJECT_ADAPTER_V1.md
          test -e docs/STATE_ROOT_V1.md
          test -e docs/MIG_002_PARITY_PROVENANCE.json
          test -e docs/MIG_003_COUPLING_CLOSURE.json
          test -e .github/scripts/supervisor-mig004-lifecycle-sandbox.ps1

          ! grep -R -nE '08_INTEGRATIONS/supervisor|01_DOCS/MAGASIN/00_PROJECT_STATE\.json|magasincoffee/magasincoffee\.github\.io|02_CORE/' src windows test .github/workflows .github/scripts
          ! grep -R -nE 'CURRENT_STATE|TASK_QUEUE' src windows .github/workflows .github/scripts
          ! grep -R -nF '../../../.github' test
          ! grep -R -nF '../../.github' test

          grep -q 'supervisor-project-adapter.v1' src/project-adapter.mjs
          grep -q 'supervisor-state-root.v1' docs/STATE_ROOT_V1.md
          grep -q 'legacy-preserve' windows/state-root.ps1

          grep -q 'if: ${{ false }}' .github/workflows/supervisor-autostart-install.yml
          grep -q 'if: ${{ false }}' .github/workflows/supervisor-lifecycle-acceptance.yml
          grep -q 'if: ${{ false }}' .github/workflows/supervisor-open-control-panel.yml
          grep -q 'if: ${{ false }}' .github/workflows/supervisor-state-maintenance.yml
          grep -q 'name: normal-release-gates-preflight' .github/workflows/supervisor-rbt009-soak.yml
          grep -A3 'name: normal-release-gates-preflight' .github/workflows/supervisor-rbt009-soak.yml | grep -q 'if: ${{ false }}'
          grep -A3 'name: tier-b-production-read-only-8h' .github/workflows/supervisor-rbt009-soak.yml | grep -q 'if: ${{ false }}'

          echo "MIG_004_ROOT_NATIVE_DEPENDENCIES_ZERO=True"
          echo "MIG_004_PROJECT_ADAPTER_BOUNDARY=True"
          echo "MIG_004_STATE_ROOT_COMPATIBILITY=True"
          echo "MIG_004_SELF_HOSTED_PRODUCTION_FAIL_CLOSED=True"
          echo "MIG_004_RBT009_TIER_B_DISABLED=True"
          echo "ZERO_PRODUCTION_MUTATION=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: ${{ false }} # MIG-004: production/self-hosted runtime audit remains disabled before MIG-005
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - run: echo "MIG-004 does not authorize production runtime mutation."
