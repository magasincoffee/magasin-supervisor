name: Supervisor Integrity

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'test/**'
      - 'SOURCE_OF_TRUTH.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-architecture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce active workflow allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          magasin-local-dispatch-receipts.yml
          sc013-coordinator-inert-apply.yml
          sc013-coordinator-hook-apply.yml
          sc013-coordinator-readonly-stage.yml
          sc013-h4a16il-safe-deploy.yml
          sc013-runtime-watchdog.yml
          supervisor-autostart-install.yml
          supervisor-control-panel-desktop-4k7im13.yml
          supervisor-integrity.yml
          supervisor-lifecycle-acceptance.yml
          supervisor-sc013-live-production.yml
          supervisor-tests.yml
          EOF
          )
          actual=$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual" = "$expected"
          echo ACTIVE_WORKFLOW_ALLOWLIST_PASS=True
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SC-013 Python preflight guards
        shell: bash
        run: python -m unittest discover -s test -p 'test_sc013_sot_python_bridge.py' -v
      - name: Validate read-only Coordinator cycle hook
        shell: bash
        run: python -m unittest discover -s test -p 'test_sc013_coordinator_cycle_preflight.py' -v
      - name: Verify SINGLE_CONVERSATION_V1 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/source-of-truth-authority.test.mjs \
            test/single-conversation-state.test.mjs \
            test/single-conversation-bootstrap.test.mjs \
            test/single-conversation-cli.test.mjs \
            test/task-execution-optimization.test.mjs \
            test/external-run-local-observer.test.mjs \
            test/sc013-production-deploy-boundary.test.mjs \
            test/sc013-h4a16il-safe-deploy.test.mjs \
            test/sc013-coordinator-readonly-stage.test.mjs \
            test/sc013-coordinator-inert-apply.test.mjs \
            test/sc013-coordinator-hook-apply.test.mjs \
            test/sc013-local-30m-tick.test.mjs \
            test/sc013-sot-adapter.test.mjs \
            test/sc013-live-observer-contract.test.mjs \
            test/sc013-owner-start-authority.test.mjs \
            test/supervisor-guardian.test.mjs
          grep -q 'SINGLE_CONVERSATION_V1' SOURCE_OF_TRUTH.md
          grep -q 'FIRST-FAILURE ITERATIVE STABILIZATION LOOP' SOURCE_OF_TRUTH.md
          echo CURRENT_ARCHITECTURE_INTEGRITY_PASS=True
      - name: Confirm hosted-only integrity
        run: echo ZERO_PRODUCTION_MUTATION=True