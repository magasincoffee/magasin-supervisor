name: SC-010 Post-Failure Diagnostic
on:
  push:
    branches: [sc010-postfail-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-1:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SC-010 durable qualification state
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc010-postfail-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 60
          exit /b %ERRORLEVEL%
  inspect-2:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SC-010 durable qualification state
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\sc010-postfail-diagnostic.ps1" -TargetComputer "DESKTOP-4K7IM13" -NonTargetHoldSeconds 60
          exit /b %ERRORLEVEL%
